<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="書類管理">
<title>道路照明 書類管理アプリ</title>
<style>
:root{
  --bg:#EEF1F4; --paper:#FFFFFF; --ink:#1B2733; --muted:#66737F; --line:#D5DCE3;
  --blue:#1F5FA8; --blue-bg:#E7EFF9; --late:#C0392B; --late-bg:#FBE9E7;
  --soon:#C77700; --soon-bg:#FFF3DC; --ok:#2C7A4B; --ok-bg:#E4F3EA; --gray:#8B97A3;
  --r:10px; --pad:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
h1,h2,h3{margin:0;font-weight:700}
h2{font-size:17px}
h3{font-size:15px}

/* ヘッダー */
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:10px;padding:8px var(--pad)}
.hd h1{font-size:16px;white-space:nowrap}
.hd select{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.tabs{display:flex;border-top:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1;min-width:72px;padding:9px 4px;border:0;background:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.tabs button .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--late);color:#fff;font-size:11px;line-height:18px;vertical-align:1px}

main{padding:var(--pad);max-width:1080px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:12px}
.card h2{margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.btn{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.btn.s{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--late);border-color:#E7B8B3}
.btn:disabled{opacity:.45;cursor:default}
label.f{display:block;margin:8px 0}
label.f span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
textarea{min-height:64px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

/* 期限レーン（ホームの主役） */
.lane{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory}
.tk{flex:0 0 150px;scroll-snap-align:start;border-radius:var(--r);padding:12px 12px 10px;background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--gray);cursor:pointer}
.tk.late{border-top-color:var(--late);background:var(--late-bg)}
.tk.soon{border-top-color:var(--soon);background:var(--soon-bg)}
.tk.ok{border-top-color:var(--blue)}
.tk .d{font-size:34px;font-weight:800;line-height:1;letter-spacing:-1px}
.tk .d small{font-size:13px;font-weight:600;margin-left:2px}
.tk .t{font-size:13px;font-weight:700;margin-top:6px;line-height:1.3}
.tk .m{font-size:11px;color:var(--muted);margin-top:4px}

/* 進捗 */
.bar{height:10px;border-radius:5px;background:#E3E8ED;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.bar i.g{background:var(--ok)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi div{background:#F6F8FA;border-radius:8px;padding:8px 10px}
.kpi b{font-size:22px;display:block}
.kpi .late b{color:var(--late)} .kpi .soon b{color:var(--soon)} .kpi .ok b{color:var(--ok)}
@media(max-width:640px){.kpi{grid-template-columns:repeat(2,1fr)}}

/* 書類一覧 */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:5px 10px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:13px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.dl{list-style:none;margin:0;padding:0}
.dl li{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.dl li:last-child{border-bottom:0}
.dl li .lb{width:8px;height:100%;min-height:36px;border-radius:4px;background:var(--gray)}
.dl li.late .lb{background:var(--late)} .dl li.soon .lb{background:var(--soon)} .dl li.ok .lb{background:var(--blue)} .dl li.done .lb{background:var(--ok)} .dl li.na .lb{background:#CBD2D9}
.dl li.done .nm,.dl li.na .nm{color:var(--muted)}
.nm{font-weight:700}
.st{font-size:12px;padding:3px 8px;border-radius:12px;background:#EEF1F4;white-space:nowrap}
.st.s1{background:#EEF1F4} .st.s2{background:var(--blue-bg);color:var(--blue)} .st.s3{background:var(--soon-bg);color:var(--soon)} .st.s4{background:var(--ok-bg);color:var(--ok)} .st.s5{background:var(--ok);color:#fff} .st.s0{background:#F3F4F6;color:var(--gray)}
.cat{font-size:12px;color:var(--muted)}
.due{font-size:12px;color:var(--muted)}
.due.late{color:var(--late);font-weight:700} .due.soon{color:var(--soon);font-weight:700}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:#F0F3F6;color:var(--muted);margin-left:4px}

/* 詳細シート */
.sheet-bg{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:40;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:41;overflow-y:auto;padding:var(--pad);transform:translateX(100%);transition:transform .2s}
.sheet.on{transform:none}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.req{list-style:none;margin:0;padding:0}
.req li{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.req li input{margin-top:4px}
.req li .x{margin-left:auto;color:var(--gray);background:none;border:0;font-size:16px}
.req li.done span{color:var(--muted);text-decoration:line-through}
.stbtns{display:flex;flex-wrap:wrap;gap:6px}
.stbtns button{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px}
.stbtns button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.link{background:var(--blue-bg);border-radius:8px;padding:10px;font-size:13px}
.link.none{background:#F3F4F6;color:var(--muted)}

/* 工程 */
.sub{display:flex;gap:6px;margin-bottom:10px}
.sub button{padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:#fff}
.sub button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gantt{overflow-x:auto}
.gt{display:grid;min-width:640px;font-size:12px}
.gt .hcell{border-bottom:1px solid var(--line);padding:4px 2px;text-align:center;color:var(--muted);white-space:nowrap;position:relative}
.gt .hcell.m{border-left:1px solid var(--line)}
.gt .lbl{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700;display:flex;flex-direction:column;justify-content:center;background:#fff;position:sticky;left:0;z-index:2}
.gt .lbl small{font-weight:400;color:var(--muted)}
.gt .trk{position:relative;border-bottom:1px solid var(--line);height:46px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/var(--w) - 1px),var(--line) calc(100%/var(--w) - 1px),var(--line) calc(100%/var(--w)))}
.gt .pl,.gt .ac{position:absolute;height:12px;border-radius:6px}
.gt .pl{top:9px;background:#B9CCE6}
.gt .ac{top:25px;background:var(--blue)}
.gt .ac.g{background:var(--ok)}
.gt .today{position:absolute;top:0;bottom:0;width:2px;background:var(--late);z-index:1}
.lg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.lg i{display:inline-block;width:18px;height:8px;border-radius:4px;vertical-align:middle;margin-right:4px}
.kt{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.kt:last-child{border-bottom:0}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;min-width:640px}
.wk .dy{background:#F6F8FA;border-radius:8px;padding:6px;min-height:120px}
.wk .dy.today{outline:2px solid var(--blue)}
.wk .dy.hol{background:#FBF0F0}
.wk .dy h4{margin:0 0 4px;font-size:12px;color:var(--muted)}
.wk .it{font-size:12px;background:#fff;border-left:3px solid var(--blue);border-radius:4px;padding:3px 6px;margin-bottom:4px;cursor:pointer}
.wk .it.doc{border-left-color:var(--soon)}
.wk .it.imp{border-left-color:var(--ok)}
.wk .it.hol{border-left-color:var(--late)}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;display:none}
.toast.on{display:block}
details summary{cursor:pointer;color:var(--blue);font-size:13px}
.src{font-size:11px;color:var(--muted)}
/* 詳細工程表（取込データ） */
.dg{border-collapse:collapse;font-size:11px;min-width:900px}
.dg th,.dg td{border:1px solid #444;padding:0;height:22px;text-align:center;white-space:nowrap;min-width:22px}
.dg th{background:#fff;font-weight:400}
.dg th.sat,.dg td.sat{background:#DCEBF7}.dg th.sun,.dg td.sun{background:#F8D8EA}
.dg th.sat,.dg th.sun{color:#1F5FA8}.dg th.sun{color:#C0392B}
.dg td.lb{text-align:center;padding:2px 6px;background:#fff;min-width:80px}
.dg td.lb.g{min-width:26px;width:26px;max-width:26px;white-space:normal;word-break:break-all;line-height:1.25;padding:2px 4px}
.dg td.tk{position:relative;height:64px;padding:0}
.dg .tr{position:absolute;left:0;right:0;top:0;bottom:0}
.dg .b{position:absolute;height:0;border-top:2px solid #000}
.dg .b.r{border-top-color:#D00}
.dg .b:before{content:'';position:absolute;left:-4px;top:-4px;width:6px;height:6px;border-radius:50%;background:inherit;background:#000}
.dg .b.r:before{background:#D00}
.dg .b:after{content:'';position:absolute;right:-1px;top:-4px;border:4px solid transparent;border-left:7px solid #000;border-right:0}
.dg .b.r:after{border-left-color:#D00}
.dg .b span{position:absolute;left:2px;top:-15px;font-size:11px;color:#000;background:transparent}
.dg .b.r span{color:#D00}
.dg .today{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--blue);z-index:1}
.dg td.note{text-align:left;padding:6px;white-space:normal;height:auto}
.wk3{border-collapse:collapse;font-size:11px;min-width:1000px}
.wk3 th,.wk3 td{border:1px solid #444;padding:0;height:20px;text-align:center;white-space:nowrap;min-width:30px}
.wk3 th.sun,.wk3 td.sun{background:#F5B7D0}.wk3 th.sat,.wk3 td.sat{background:#CDEFF6}
.wk3 td.lb{text-align:left;padding:2px 6px;min-width:140px;background:#fff;white-space:normal}
.wk3 td.tk{position:relative;height:40px}
.wk3 .tr{position:absolute;left:0;right:0;top:0;bottom:0}
.wk3 .b{position:absolute;height:0;border-top:2px solid #000}
.wk3 .b.r{border-top-color:#D00;top:24px}.wk3 .b.p{top:12px}
.wk3 .b span{position:absolute;left:2px;top:-14px;font-size:10px;white-space:nowrap}
.wk3 .b.r span{color:#D00}
.wk3 td.hol{color:#C0392B;font-size:10px;line-height:1.1}
.wk3 td.txt{text-align:left;padding:4px 6px;white-space:normal;vertical-align:top;height:auto}
.wk3 td.txt.on{color:#D00}
.lg2{font-size:11px;margin-top:4px}.lg2 i{display:inline-block;width:24px;border-top:2px solid #000;vertical-align:middle;margin:0 6px 0 2px}.lg2 i.r{border-top-color:#D00}
@media print{header,.sub,.btn,.muted.small.hint{display:none!important}main{padding:0;max-width:none}.card{border:0;page-break-inside:avoid}@page{size:A3 landscape;margin:8mm}.dg,.wk3{min-width:0;width:100%}}
/* 時系列 */
.tl{position:relative;padding-left:26px}
.tl:before{content:'';position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--line)}
.tl .mh{position:relative;font-weight:700;margin:14px 0 6px;color:var(--ink)}
.tl .mh:before{content:'';position:absolute;left:-23px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.tl .ms{position:relative;margin:8px 0;padding:6px 10px;border-radius:6px;background:var(--blue-bg);color:var(--blue);font-weight:700;font-size:13px}
.tl .ms:before{content:'';position:absolute;left:-21px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.tl .ms.today{background:var(--late-bg);color:var(--late)}.tl .ms.today:before{background:var(--late)}
.tl .ev{position:relative;display:grid;grid-template-columns:68px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;cursor:pointer}
.tl .ev:hover{background:#F6F8FA}
.tl .ev:before{content:'';position:absolute;left:-21px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--gray)}
.tl .ev.late:before{background:var(--late)}.tl .ev.soon:before{background:var(--soon)}.tl .ev.ok:before{background:var(--blue)}.tl .ev.done:before{background:var(--ok)}.tl .ev.na:before{background:#CBD2D9}
.tl .ev.done .nm,.tl .ev.na .nm{color:var(--muted)}
.tl .ev .dt{font-size:12px;color:var(--muted);white-space:nowrap}
.tl .ev.late .dt{color:var(--late);font-weight:700}.tl .ev.soon .dt{color:var(--soon);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>書類管理 <small id="ver" style="font-size:11px;color:var(--muted);font-weight:400"></small></h1>
    <select id="projSel" onchange="selProj(this.value)"></select>
    <button class="btn s" onclick="openProjForm()">＋ 工事</button>
    <button class="btn s" id="shChip" onclick="go('set')" title="共有の状態（工事情報タブで操作）">共有 未接続</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-t="home" onclick="go('home')">期限</button>
    <button data-t="docs" onclick="go('docs')">書類</button>
    <button data-t="imp" onclick="go('imp')">現場アプリ</button>
    <button data-t="set" onclick="go('set')">工事情報</button>
  </nav>
</header>
<main id="main"></main>

<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileTokki" accept=".json,application/json" style="display:none" onchange="importTokki(this.files[0]);this.value=''">
<input type="file" id="fileGenba" accept=".json,application/json" style="display:none" onchange="importGenba(this.files[0]);this.value=''">
<input type="file" id="fileSched" accept=".xlsx,.xls" style="display:none" onchange="importSched(this.files[0]);this.value=''">
<input type="file" id="fileApp" accept=".json,application/json" style="display:none" onchange="importApp(this.files[0]);this.value=''">

<script>
/* ==========================================================
   書類テンプレート（沖縄総合事務局＝国交省直轄の標準一式）
   出典：国土交通省「工事関係書類一覧表」（H23.6.1、
   https://www.mlit.go.jp/tec/sekisan/sekou/pdf/230601kouzikankeisyoruiichiran1.pdf ）
   電気通信設備工事共通仕様書（令和8年3月）の書類は cat:"電気" で追加（条項は要確認）
   rule: C=契約日基準 S=着工日基準 E=工期末基準 M=毎月 X=都度（期限なし）
   n: 基準日からの日数
   ========================================================== */
const TPL = [
 // 契約前（落札決定日基準）出典：沖縄総合事務局「工事請負契約書記載要領」、建設リサイクル法第12条
 {id:'recycle',cat:'1 契約関係',ass:'亮和',sub:'D',name:'建設リサイクル法 説明書（分別解体等の計画等）',rule:'A',n:10,biz:true,form:'説明書・別表3・別紙4',src:'建設工事に係る資材の再資源化等に関する法律第12条第1項／工事請負契約書記載要領',kind:'提出',note:'様式は発注者から届く → 記入 → 担当課（防災情報課）に事前説明 → 提出 → 承認。承認日が契約日の条件（契約保証と遅い方）。期限は目安（落札決定から休日除く10日）で、様式が届く時期に合わせて直す',req:['発注者から様式（説明書・別表3・別紙4）が届く（発注者待ち）','説明書（表紙：宛名 分任支出負担行為担当官 南部国道事務所長、工事名・場所）','別表3 分別解体等の計画等（工事の種類：維持・修繕／電気、特定建設資材：コンクリート・アスファルト）','別表3 工作物の調査結果（周辺状況・作業場所・搬出経路）','別表3 工程ごとの作業内容（仮設・土工・基礎・本体・付属品）','別表3 廃棄物発生見込量（コンクリート塊・アスファルト塊 トン）','別紙4 再資源化等をする施設の名称及び所在地','別紙4 再資源化等に要する費用（直接工事費・運搬費含む）','工程表（工程の概要を示す資料）','担当課への事前説明・了解'],link:'recycle'},

function addDays(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return ymd(x)}

/* ==================== 工事・書類生成 ==================== */
function addBiz(d,n){let x=d;let c=0;while(c<n){x=addDays(x,1);const g=new Date(x+'T00:00:00').getDay();if(g!==0&&g!==6)c++}return x}
function dueOf(t,p,ym){
  if(t.rule==='K'){const c=[p.recycleOkDate,p.hoshoDate].filter(Boolean).sort();if(c.length)return c[c.length-1];return p.awardDate?addBiz(p.awardDate,7):''}
  if(t.rule==='A')return p.awardDate?(t.biz?addBiz(p.awardDate,t.n):addDays(p.awardDate,t.n)):'';
  if(t.rule==='C'){const base=p.contractDate||(t.strict?'':[p.recycleOkDate,p.hoshoDate].filter(Boolean).sort().pop()||'');return base?(t.biz?addBiz(base,t.n):addDays(base,t.n)):''}
  if(t.rule==='S')return p.startDate?addDays(p.startDate,t.n):'';
  if(t.rule==='E')return p.endDate?addDays(p.endDate,t.n):'';
  if(t.rule==='M'&&ym){const [y,m]=ym.split('-').map(Number);return monthEnd(y,m-1)}
  return '';
}
function months(p){
  const out=[];if(!p.startDate||!p.endDate)return out;
  let d=new Date(p.startDate+'T00:00:00');const e=new Date(p.endDate+'T00:00:00');
  while(d<=e){out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);d=new Date(d.getFullYear(),d.getMonth()+1,1)}
  return out;
}
/* 特記仕様書の上書きを含めた書類の定義（d.tk＝特記で追加・変更した項目） */
function tplOf(d){const b=TPL.find(x=>x.id===d.tid)||{};if(!d.tk)return b;const k=Object.assign({},d.tk);delete k.note;delete k.req;const t=Object.assign({},b,k);t.src=[b.src,d.tk.src].filter(Boolean).join('／');return t}
function mkDoc(t,p,ym){
  return {id:uid(),tid:t.id,name:t.name+(ym?`（${ym.replace('-','年')}月）`:''),cat:t.cat,ym:ym||'',due:dueOf(t,p,ym),dueAuto:true,status:'未着手',req:t.req.map(r=>({t:r,done:false})),memo:'',submitted:'',approved:'',assignee:t.ass||'',sub:t.sub||''};
}
function buildDocs(p){
  const docs=[];
  for(const t of TPL){
    if(t.rule==='M'){for(const ym of months(p))docs.push(mkDoc(t,p,ym))}
    else docs.push(mkDoc(t,p));
  }
  return docs;
}
function recalc(p){
  // 自動期限の再計算＋毎月書類の増減
  for(const d of p.docs){const t=tplOf(d);if(t&&t.rule&&d.dueAuto)d.due=dueOf(t,p,d.ym)}
  const ms=months(p);
  for(const t of TPL.filter(x=>x.rule==='M')){
    for(const ym of ms){if(!p.docs.some(d=>d.tid===t.id&&d.ym===ym))p.docs.push(mkDoc(t,p,ym))}
    p.docs=p.docs.filter(d=>!(d.tid===t.id&&d.ym&&!ms.includes(d.ym)&&d.status==='未着手'));
  }
}

function dueCls(d){
  if(d.status==='該当なし')return 'na';
  if(d.status==='提出済'||d.status==='完了')return 'done';
  if(!d.due)return '';
  const n=diff(d.due,today());
  return n<0?'late':n<=7?'soon':'ok';
}
const MEMBERS=['上島','亮和','D','武富'];
function members(p){return (p.members&&p.members.length)?p.members:MEMBERS}
function assFilter(list){if(!S.dass||S.dass==='all')return list;if(S.dass==='none')return list.filter(d=>!d.assignee&&!d.sub);return list.filter(d=>d.assignee===S.dass||d.sub===S.dass)}
function assChips(p){const ms=members(p);return ms.length?`<div class="filters"><span class="small muted" style="padding:5px 0">担当</span>${['all',...ms,'none'].map(a=>`<button class="chip ${(S.dass||'all')===a?'on':''}" onclick="S.dass='${esc(a)}';save();render()">${a==='all'?'全員':a==='none'?'未割当':esc(a)}</button>`).join('')}</div>`:''}
function isProv(d,p){const t=tplOf(d);return !!(t&&t.rule==='C'&&!t.strict&&!p.contractDate&&d.dueAuto&&d.due)}

/* ---- 特記仕様書の取込（format dl-shorui-tokki） ---- */
async function importTokki(file){
  if(!file)return;const p=P();if(!p){toast('先に工事を選んでください');return}
  let j;try{j=JSON.parse(await file.text())}catch(e){toast('JSONが読めません');return}
  if(!j||j.format!=='dl-shorui-tokki'||!Array.isArray(j.items)){toast('書類管理アプリ用の特記JSONではありません');return}
  let n=0;
  for(const it of j.items){
    const tk={};for(const k of ['key','name','cat','rule','n','biz','strict','form','kind','cond','note','src','ass'])if(it[k]!==undefined)tk[k]=it[k];
    const reqs=(it.req||[]).map(r=>({t:r,done:false,tk:true}));
    if(it.tid){
      const ds=p.docs.filter(d=>d.tid===it.tid);if(!ds.length)continue;
      for(const d of ds){d.tk=tk;if(it.cat)d.cat=it.cat;if(it.name&&!d.ym)d.name=it.name;for(const r of reqs)if(!d.req.some(x=>x.t===r.t))d.req.push(Object.assign({},r));if(it.ass&&!d.assignee)d.assignee=it.ass;touch(d);n++}
    }else{
      if(!it.key||!it.name)continue;
      let d=p.docs.find(x=>x.tkey===it.key);
      if(d){d.name=it.name;d.cat=it.cat||d.cat;d.tk=tk;for(const r of reqs)if(!d.req.some(x=>x.t===r.t))d.req.push(Object.assign({},r))}
      else{d={id:uid(),tid:'',tkey:it.key,name:it.name,cat:CATS.includes(it.cat)?it.cat:'5 施工中',ym:'',due:'',dueAuto:!!(it.rule&&it.rule!=='X'),status:'未着手',req:reqs,memo:'',submitted:'',approved:'',assignee:it.ass||'',tk};p.docs.push(d)}
      touch(d);n++;
    }
  }
  p.tokki={at:now(),title:j.title||file.name,specs:j.specs||[],n};p.pu=now();p.pby=S.me||'';
  recalc(p);save();render();toast(`特記仕様書から ${n} 件を追加・変更しました`);
}
function clearTokki(){
  const p=P();if(!p||!p.tokki)return;if(!confirm('特記仕様書で追加した書類を削除し、変更した項目を元に戻しますか？'))return;
  p.del=p.del||[];
  p.docs=p.docs.filter(d=>{if(d.tkey){p.del.push(d.id);return false}return true});
  for(const d of p.docs){if(d.tk){delete d.tk;d.req=d.req.filter(r=>!r.tk);const t=TPL.find(x=>x.id===d.tid);if(t)d.cat=t.cat;touch(d)}}
  p.tokki=null;p.pu=now();p.pby=S.me||'';recalc(p);save();render();toast('特記の取込を解除しました');
}

/* ---- 担当別（人ごとに担当書類を区分） ---- */
function assigneeCard(p){

  const sec=groups.map(mm=>{const ds=p.docs.filter(d=>(mm?(d.assignee===mm||d.sub===mm):(!d.assignee&&!d.sub))&&d.status!=='該当なし').sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));if(!ds.length)return '';
    const o=ds.filter(open),late=o.filter(d=>dueCls(d)==='late').length;const showAll=S.assAll===mm;

  return `<div class="card"><div class="muted small">担当は各書類の詳細シートで設定。候補は工事情報の「担当者の一覧」から。未割当の書類は末尾にまとめて表示</div></div>${sec}`;
}
/* ---- 書類の時系列 ---- */
function timelineCard(p){
  const hideNa=S.tlHideNa!==false;
  const docs=assFilter(p.docs.filter(d=>!(hideNa&&d.status==='該当なし')));
  const dated=docs.filter(d=>d.due).sort((a,b)=>a.due.localeCompare(b.due));
  const undated=docs.filter(d=>!d.due);
  const t0=today();
  const ms=[['落札決定',p.awardDate],['契約',p.contractDate],['着工',p.startDate],['工期末',p.endDate]].filter(x=>x[1]);
  // 月ごとにまとめ、節目と今日を差し込む
  const items=[...dated.map(d=>({k:'d',d,at:d.due})),...ms.map(([n,at])=>({k:'m',n,at})),{k:'t',at:t0}].sort((a,b)=>a.at.localeCompare(b.at)||(a.k!=='d'?-1:b.k!=='d'?1:0)||a.d.cat.localeCompare(b.d.cat)||TPL.findIndex(x=>x.id===a.d.tid)-TPL.findIndex(x=>x.id===b.d.tid));
  let out='',curM='';
  for(const it of items){
    const ym=it.at.slice(0,7);if(ym!==curM){curM=ym;out+=`<div class="mh">${+ym.slice(0,4)}年${+ym.slice(5)}月</div>`}
    if(it.k==='m')out+=`<div class="ms">◆ ${it.n}　${fmt(it.at)}</div>`;
    else if(it.k==='t')out+=`<div class="ms today">▶ 今日 ${fmt(it.at)}</div>`;
    else{const d=it.d,c=dueCls(d),t=tplOf(d)||{};out+=`<div class="ev ${c}" onclick="openDoc('${d.id}')"><span class="dt">${fmt(d.due)}${isProv(d,p)?'<span class="tag">仮</span>':''}</span><span><span class="nm">${esc(d.name)}</span>${t.cond?'<span class="tag">該当時</span>':''}${t.kind==='提示'?'<span class="tag">提示</span>':''}<span class="cat" style="margin-left:6px">${esc(CL(d.cat))}</span>${d.assignee?`<span class="tag">${esc(d.assignee)}</span>`:''}</span><span class="st ${STCLS[d.status]}">${d.status}</span></div>`}
  }
  const und=undated.length?`<div class="mh" style="margin-top:20px">都度（施工中に発生したとき）</div>${undated.map(d=>{const t=tplOf(d)||{};return `<div class="ev ${dueCls(d)}" onclick="openDoc('${d.id}')"><span class="dt">${t.kind==='発注者待ち'?'発注者待ち':'都度'}</span><span><span class="nm">${esc(d.name)}</span>${t.cond?'<span class="tag">該当時</span>':''}${t.kind==='提示'?'<span class="tag">提示</span>':''}<span class="cat" style="margin-left:6px">${esc(CL(d.cat))}</span>${t.note||t.cond?`<div class="muted small" style="white-space:normal;line-height:1.35">${esc((t.cond?'該当時：'+t.cond:t.note.split('。')[0]))}</div>`:''}</span><span class="st ${STCLS[d.status]}">${d.status}</span></div>`}).join('')}`:'';
  const missing=[['落札決定日',p.awardDate],['契約日',p.contractDate],['着工日',p.startDate],['工期末',p.endDate]].filter(x=>!x[1]).map(x=>x[0]);
  return `<div class="card"><div class="row"><h2 class="grow">必要書類の時系列</h2><label class="small"><input type="checkbox" ${hideNa?'checked':''} onchange="S.tlHideNa=this.checked;save();render()"> 該当なしを隠す</label><button class="btn s" onclick="window.print()">印刷</button></div>
  ${missing.length?`<div class="muted small">${missing.join('・')}が未設定のため、その基準の書類は「都度」に出ています（工事情報で設定）</div>`:''}
  ${assChips(p)}
  <div class="tl">${out}${und}</div></div>`;
}

/* ---- 現場アプリのデータと書類の対応 ---- */
function linkInfo(key,p){
  const I=p.imp;if(!I)return {ok:false,html:'現場アプリのデータが未取込です。「現場アプリ」タブでJSONを読み込むと、ここに記載用の情報が出ます。'};

   case 'douro':{const n2=W.filter(w=>w.plan).length;return {ok:true,html:`施工予定日のある作業 ${n(n2)}件（${minmax(W.map(w=>w.plan))}）。この期間で申請。規制箇所は路線別：${countBy(L,'route')}`}}

   case 'denryoku':{const ws=W.filter(w=>/新設|配管配線/.test(w.kubun));return {ok:ws.length>0,html:ws.length?`新設・配管配線の作業 ${n(ws.length)}件：${ws.map(w=>w.no).join('、')}。台帳の電力申請番号と現調の同系統負荷設備（VA合計）を確認。`:'新設・配管配線の作業はありません（申込不要の見込み）'}}

   case 'keikaku':return {ok:true,html:`工事概要の材料：管理番号 ${n(L.length)}本、路線 ${countBy(L,'route')}、作業内容 ${countBy(W,'kubun')}。主要資材は現場アプリの「資材・数量一覧」CSVを添付。`};
   case 'shosa':return {ok:W.some(w=>w.kyogi),html:`現調の要協議 ${n(W.filter(w=>w.kyogi).length)}件（${W.filter(w=>w.kyogi).map(w=>w.no).join('、')||'なし'}）。台帳との相違は台帳変更履歴CSVを添付。`};

   case 'shashin':return {ok:true,html:`写真 ${n(I.photos)}枚（JSON内の枚数、写真なし送信なら0）。整理は写真帳スキルで。`};
   case 'daicho':return {ok:true,html:`台帳 ${n(L.length)}件。完了反映済み（更新年月日入り） ${n(L.filter(l=>l.updated).length)}件。台帳CSV・台帳変更履歴CSVを添付。`};

  }

}
function countBy(arr,k){const c={};for(const x of arr){const v=x[k]||'未設定';c[v]=(c[v]||0)+1}return Object.entries(c).map(([k,v])=>`${esc(k)} ${v}`).join('、')||'なし'}

function koteiProg(k,p){
  // 現場アプリから自動集計（match語で作業内容・工種を照合）
  if(p.imp&&k.match.length){const ws=p.imp.works.filter(w=>k.match.some(s=>(w.kubun+w.kind).includes(s)));if(ws.length)return {qty:ws.length,done:ws.filter(w=>w.closed).length,pct:Math.round(ws.filter(w=>w.closed).length/ws.length*100),auto:true,dates:ws.map(w=>w.plan).filter(Boolean).sort()}}
  if(k.name.startsWith('完成書類')){const a=p.docs.filter(d=>d.cat==='6 完成'&&d.status!=='該当なし'),dn=a.filter(d=>['提出済','完了'].includes(d.status));return {qty:a.length,done:dn.length,pct:a.length?Math.round(dn.length/a.length*100):0,auto:true}}
  const q=+k.qty||0,d=+k.done||0;return {qty:q,done:d,pct:k.pct!==''?+k.pct:(q?Math.round(d/q*100):0),auto:false};
}
function ganttCard(p){
  const ds=[p.startDate,p.endDate,...p.kotei.flatMap(k=>[k.ps,k.pe,k.as,k.ae])].filter(Boolean).sort();
  if(!ds.length)return `<div class="card"><div class="empty">工事情報に着工日・工期末を入れると工程表が出ます</div></div>`;
  // 週の列（月曜始まり）
  const s=new Date(ds[0]+'T00:00:00');s.setDate(s.getDate()-((s.getDay()+6)%7));
  const e=new Date(ds[ds.length-1]+'T00:00:00');
  const weeks=[];for(let d=new Date(s);d<=e;d.setDate(d.getDate()+7))weeks.push(new Date(d));
  if(weeks.length>60)return `<div class="card"><div class="empty">期間が長すぎます（60週超）。日付を確認してください</div></div>`;
  const w=weeks.length,x0=weeks[0].getTime(),span=w*7*86400000;
  const pos=d=>Math.max(0,Math.min(100,(new Date(d+'T00:00:00')-x0)/span*100));
  const bar=(a,b,cls)=>a&&b&&b>=a?`<div class="${cls}" style="left:${pos(a)}%;width:${Math.max(1,pos(addDays(b,1))-pos(a))}%"></div>`:'';
  const t0=today();
  const head=weeks.map((d,i)=>`<div class="hcell ${d.getDate()<=7?'m':''}">${d.getDate()<=7||i===0?`${d.getMonth()+1}月`:''}<br>${d.getDate()}</div>`).join('');
  const rows=p.kotei.map(k=>{const pr=koteiProg(k,p);const ac=k.as&&k.ae?bar(k.as,k.ae,'ac'+(pr.pct===100?' g':'')):(k.as?bar(k.as,pr.pct===100&&k.ae?k.ae:t0,'ac'+(pr.pct===100?' g':'')):'');
    return `<div class="lbl">${esc(k.name)}<small>${pr.pct}%${pr.auto?'（自動）':''}${pr.qty?` ${pr.done}/${pr.qty}`:''}</small></div><div class="trk" style="--w:${w}">${bar(k.ps,k.pe,'pl')}${ac}${t0>=ds[0]?`<div class="today" style="left:${pos(t0)}%"></div>`:''}</div>`}).join('');
  return `<div class="card"><h2>全体工程</h2><div class="gantt"><div class="gt" style="grid-template-columns:150px repeat(${w},minmax(28px,1fr))"><div class="lbl"></div>${head}${rows}</div></div>
  <div class="lg"><span><i style="background:#B9CCE6"></i>予定</span><span><i style="background:var(--blue)"></i>実績</span><span><i style="background:var(--ok)"></i>完了</span><span><i style="background:var(--late);width:2px"></i>今日</span></div></div>`;
}

  return `<div class="card"><h2>工種の予定・実績</h2><div class="muted small" style="margin-bottom:6px">進捗は現場アプリの作業内容から自動集計。該当がない工種は数量・完了数を手入力</div>
  <table class="t"><tr><th>工種</th><th>予定</th><th>実績</th><th>数量／完了</th><th></th></tr>
  ${p.kotei.map(k=>{const pr=koteiProg(k,p);return `<tr><td><input type="text" value="${esc(k.name)}" onchange="kupd('${k.id}','name',this.value)" style="min-width:120px"></td>
   <td><input type="date" value="${k.ps}" onchange="kupd('${k.id}','ps',this.value)"><input type="date" value="${k.pe}" onchange="kupd('${k.id}','pe',this.value)"></td>
   <td><input type="date" value="${k.as}" onchange="kupd('${k.id}','as',this.value)"><input type="date" value="${k.ae}" onchange="kupd('${k.id}','ae',this.value)"></td>

function kupd(id,k,v){const x=P().kotei.find(y=>y.id===id);x[k]=v;touch(x);save();render()}
function kdel(id){if(!confirm('この工種を削除しますか？'))return;const p=P();(p.del=p.del||[]).push(id);p.kotei=p.kotei.filter(k=>k.id!==id);save();render()}
function kadd(){const name=prompt('工種名');if(!name)return;P().kotei.push({id:uid(),name,match:[],ps:'',pe:'',as:'',ae:'',qty:'',done:'',pct:''});save();render()}
function kfill(){const p=P();if(!p.imp){toast('現場アプリのデータが未取込です');return}let n=0;
  for(const k of p.kotei){const pr=koteiProg(k,p);if(pr.auto&&pr.dates&&pr.dates.length){if(!k.ps)k.ps=pr.dates[0];if(!k.pe)k.pe=pr.dates[pr.dates.length-1];n++}}
  save();render();toast(`${n}工種の予定を埋めました`)}
function kindCard(p){
  return `<div class="card"><h2>工種別の進み具合</h2>${p.kotei.map(k=>{const pr=koteiProg(k,p);
   return `<div class="kt"><div><b>${esc(k.name)}</b><div class="bar" style="margin-top:4px"><i class="${pr.pct===100?'g':''}" style="width:${pr.pct}%"></i></div><div class="muted small">${k.ps?`予定 ${fmt(k.ps)}〜${fmt(k.pe)}`:'予定未設定'}${k.as?`　実績 ${fmt(k.as)}〜${k.ae?fmt(k.ae):''}`:''}</div></div><div style="text-align:right"><b style="font-size:20px">${pr.pct}%</b><div class="muted small">${pr.qty?`${pr.done}/${pr.qty}件`:'－'}${pr.auto?'<br>現場アプリから':''}</div></div></div>`}).join('')}
   ${p.imp?`<h3 style="margin-top:14px">管理番号ごとの状況（現場アプリ）</h3><table class="t"><tr><th>管理番号</th><th>路線</th><th>作業</th><th>施工予定</th><th>状態</th></tr>${p.imp.works.slice().sort((a,b)=>(a.plan||'9').localeCompare(b.plan||'9')).map(w=>`<tr><td>${esc(w.no)}</td><td>${esc(w.route)}</td><td>${esc(w.kubun||w.kind)}</td><td>${w.plan?fmt(w.plan):'－'}</td><td>${w.closed?'<span class="st s5">完了</span>':w.kyogi?'<span class="st s3">要協議</span>':'<span class="st s2">進行中</span>'}</td></tr>`).join('')}</table>`:''}
  </div>`;
}
function weekCard(p,base,full){
  const b=new Date(base+'T00:00:00');b.setDate(b.getDate()-((b.getDay()+6)%7));
  const days=[...Array(7)].map((_,i)=>{const d=new Date(b);d.setDate(d.getDate()+i);return ymd(d)});
  const items=d=>{const out=[];
    for(const x of p.week.filter(x=>x.d===d))out.push(`<div class="it ${x.hol?'hol':''}" onclick="event.stopPropagation();wdel('${x.id}')">${esc(x.t)}</div>`);
    if(p.imp)for(const w of p.imp.works.filter(w=>w.plan===d))out.push(`<div class="it imp">${esc(w.no)} ${esc(w.kubun||w.kind)}${w.closed?' ✔':''}</div>`);
    for(const dc of p.docs.filter(x=>x.due===d&&!['提出済','完了','該当なし'].includes(x.status)))out.push(`<div class="it doc" onclick="event.stopPropagation();openDoc('${dc.id}')">期限 ${esc(dc.name)}</div>`);
    return out.join('')};
  const t0=today();
  return `<div class="card"><div class="row" style="margin-bottom:8px"><h2 class="grow">週間工程 ${fmt(days[0])}〜${fmt(days[6])}</h2>${full?`<button class="btn s" onclick="wmove(-7)">‹ 前週</button><button class="btn s" onclick="S.wk0=null;save();render()">今週</button><button class="btn s" onclick="wmove(7)">翌週 ›</button>`:`<button class="btn s" onclick="S.tab='kotei';S.ksub='week';save();render()">週間工程へ</button>`}</div>
  <div style="overflow-x:auto"><div class="wk">${days.map(d=>{const g=new Date(d+'T00:00:00').getDay();return `<div class="dy ${d===t0?'today':''} ${g===0||g===6?'hol':''}" onclick="wadd('${d}')"><h4>${fmt(d)}</h4>${items(d)}</div>`}).join('')}</div></div>
  <div class="muted small" style="margin-top:6px">日をタップで予定を追加。緑＝現場アプリの施工予定、橙＝書類の期限、青＝手入力。予定をタップで削除</div></div>`;
}
function wmove(n){S.wk0=addDays(S.wk0||today(),n);save();render()}
function wadd(d){const t=prompt(`${fmt(d)} の予定（作業内容・管理番号・人員など）`);if(!t)return;P().week.push({id:uid(),d,t,hol:/休|規制/.test(t)});save();render()}
function wdel(id){const p=P();const x=p.week.find(y=>y.id===id);if(!confirm(`「${x.t}」を削除しますか？`))return;(p.del=p.del||[]).push(id);p.week=p.week.filter(y=>y.id!==id);save();render()}

/* ==================== 工程データの取込（Excel） ==================== */
function schedImportCard(p){
  return `<div class="card"><div class="row"><h2 class="grow">工程データ</h2><button class="btn s p" onclick="document.getElementById('fileSched').click()">Excelを読み込む</button>${p.sched?`<button class="btn s" onclick="window.print()">印刷</button><button class="btn s danger" onclick="if(confirm('取り込んだ工程データを消しますか？')){P().sched=null;save();render()}">消す</button>`:''}</div>
  <div class="muted small hint">「工程データ_取込用.xlsx」のシート「全体工程」「週間」を読み込みます。${p.sched?`取込 ${esc(p.sched.at)}：全体工程 ${p.sched.rows.length}行、週間 ${p.sched.wk.length}行`:'未取込（取り込むまでは工種の手入力表で表示）'}</div></div>`;
}
function toYmd(v,yr){
  if(v===undefined||v===null||v==='')return '';
  if(Object.prototype.toString.call(v)==='[object Date]'&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*86400000));return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
  const s=String(v).trim().replace(/[年月]/g,'/').replace(/日/,'');
  let m=s.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[\/-](\d{1,2})/);if(m)return `${yr}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  return '';
}
function importSched(f){
  if(!f)return;if(typeof XLSX==='undefined'){toast('Excel読込ライブラリが読めません（オンラインで開いてください）');return}
  const r=new FileReader();r.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(r.result),{type:'array',cellDates:true});const p=P();const yr=(p.startDate||today()).slice(0,4);
    const sh=n=>{const ws=wb.Sheets[n];return ws?XLSX.utils.sheet_to_json(ws,{header:1,defval:''}):null};
    const g=sh('全体工程'),w=sh('週間');if(!g&&!w)throw new Error('シート「全体工程」「週間」が見つかりません');
    const rows=[],wk=[];
    if(g){let cur='';for(const r0 of g.slice(1)){if(!r0.some(x=>x!==''))continue;const [ks,bs,nm,ps,pe,as,ae,h1,h2,memo]=r0;if(ks)cur=String(ks).trim();
      rows.push({k:cur,b:String(bs||'').trim(),n:String(nm||'').trim(),ps:toYmd(ps,yr),pe:toYmd(pe,yr),as:toYmd(as,yr),ae:toYmd(ae,yr),h1:String(h1||'').toUpperCase(),h2:String(h2||'').toUpperCase(),memo:String(memo||'').trim()})}}
    if(w){for(const r0 of w.slice(1)){if(!r0.some(x=>x!==''))continue;const [ds,de,ks,kb,nm,memo]=r0;const s=toYmd(ds,yr);if(!s&&!nm)continue;
      wk.push({s,e:toYmd(de,yr)||s,k:String(ks||'').trim(),kb:String(kb||'').trim(),n:String(nm||'').trim(),memo:String(memo||'').trim()})}}
    p.sched={at:new Date().toLocaleString('ja-JP'),u:now(),rows:rows.filter(x=>x.k||x.n),wk};save();render();toast(`全体工程 ${p.sched.rows.length}行・週間 ${wk.length}行を取り込みました`);
  }catch(e){toast('読み込めませんでした：'+e.message)}};r.readAsArrayBuffer(f);
}
/* 詳細工程表（AM/PM列、予定＝黒、施工完了＝赤） */
function detailGantt(p){
  const R=p.sched.rows.filter(r=>r.k!=='備考');const notes=p.sched.rows.filter(r=>r.k==='備考');
  const ds=R.flatMap(r=>[r.ps,r.pe,r.as,r.ae]).filter(Boolean).sort();
  if(!ds.length)return '<div class="card"><div class="empty">全体工程に日付がありません</div></div>';
  const days=[];for(let d=ds[0];d<=ds[ds.length-1];d=addDays(d,1))days.push(d);
  if(days.length>90)return '<div class="card"><div class="empty">期間が90日を超えています。分けて取り込んでください</div></div>';
  const x0=days[0];const tot=days.length*2;const t0=today();
  const col=(d,h)=>diff(d,x0)*2+(h==='PM'?1:0);
  const bar=(s,e,h1,h2,cls,label,lane)=>{if(!s||!e||e<s)return '';const a=col(s,h1==='PM'?'PM':'AM'),b=col(e,h2==='AM'?'AM':'PM')+1;const top=18+lane*24+(cls==='r'?9:0);return `<div class="b ${cls}" style="left:${a/tot*100}%;width:${(b-a)/tot*100}%;top:${top}px"><span>${esc(label)}</span></div>`};
  const lanes=items=>{let prevA=-99,prevLen=0,lane=0;return items.slice().sort((x,y)=>(x.ps||x.as).localeCompare(y.ps||y.as)).map(it=>{const a=col(it.ps||it.as,it.h1==='PM'?'PM':'AM');const over=(a-prevA)*23<prevLen*11+6;lane=over?(lane?0:1):0;prevA=a;prevLen=(it.n||'').length;return {it,lane}})};
  // 工種ごとにまとめる
  const groups=[];for(const r of R){let g=groups.find(x=>x.k===r.k);if(!g){g={k:r.k,rows:[]};groups.push(g)}let row=g.rows.find(x=>x.b===r.b);if(!row){row={b:r.b,items:[]};g.rows.push(row)}row.items.push(r)}
  const hd1=days.map(d=>{const g=new Date(d+'T00:00:00').getDay();const c=g===0?'sun':g===6?'sat':'';return `<th colspan="2" class="${c}">${fmt(d).replace('(','<br>(')}</th>`}).join('');
  const hd2=days.map(d=>{const g=new Date(d+'T00:00:00').getDay();const c=g===0?'sun':g===6?'sat':'';return `<th class="${c}">AM</th><th class="${c}">PM</th>`}).join('');
  const cells=days.map(d=>{const g=new Date(d+'T00:00:00').getDay();const c=g===0?'sun':g===6?'sat':'';return `<td class="${c}"></td><td class="${c}"></td>`}).join('');
  let body='';
  for(const g of groups){g.rows.forEach((row,i)=>{
    body+=`<tr>${i===0?`<td class="lb g" rowspan="${g.rows.length}"><span>${esc(g.k)}</span></td>`:''}<td class="lb">${esc(row.b).replace(/\s+/g,'<br>')}</td><td class="tk" colspan="${tot}" style="padding:0"><div class="tr"><table class="dg" style="position:absolute;inset:0;width:100%;height:100%;border:0;min-width:0"><tr>${cells}</tr></table>${lanes(row.items).map(({it,lane})=>bar(it.ps,it.pe,it.h1,it.h2,'p',it.n,lane)+bar(it.as,it.ae,it.h1,it.h2,'r','',lane)).join('')}${t0>=x0&&t0<=days[days.length-1]?`<div class="today" style="left:${col(t0,'AM')/tot*100}%"></div>`:''}</div></td></tr>`})}
  return `<div class="card"><div class="row"><h2 class="grow">詳細工程表</h2><span class="lg2"><i></i>予定<i class="r"></i>施工完了　<span style="color:var(--blue)">┆</span> 今日</span></div>
  <div class="muted small hint">${esc(p.name)}　工期 ${p.startDate?fmt(p.startDate):'－'}〜${p.endDate?fmt(p.endDate):'－'}</div>
  <div style="overflow-x:auto"><table class="dg"><tr><th rowspan="2" colspan="2" style="min-width:110px">工種・施工箇所</th>${hd1}</tr><tr>${hd2}</tr>${body}
  ${notes.length?`<tr><td class="lb" colspan="2">備考</td><td class="note" colspan="${tot}">${notes.map(n=>`・${esc(n.n||n.memo)}`).join('<br>')}</td></tr>`:''}</table></div></div>`;
}
/* 週間工程表（前週の実施／今週の予定／翌週の予定） */
function week3Card(p,base){
  const b=new Date(base+'T00:00:00');b.setDate(b.getDate()-b.getDay()); // 日曜始まり
  const d0=ymd(b);const days=[...Array(21)].map((_,i)=>addDays(d0,i-7));
  const wkOf=d=>d<days[7]?0:d<days[14]?1:2;
  const W=(p.sched?p.sched.wk:[]).filter(x=>x.s<=days[20]&&x.e>=days[0]);
  const G=(p.sched?p.sched.rows:[]).filter(r=>r.k!=='備考');
  // 工種行：週間シートの予定・実施、全体工程の行、現場アプリの作業内容、手入力
  const rowsMap=new Map();const add=(k,item)=>{if(!rowsMap.has(k))rowsMap.set(k,[]);rowsMap.get(k).push(item)};
  for(const x of W.filter(x=>/^(予定|実施)$/.test(x.kb)))add(x.k||x.n,{s:x.s,e:x.e,cls:x.kb==='実施'?'r':'p',n:x.n});
  for(const r of G){const k=r.k+(r.b?' '+r.b:'');if(r.ps&&r.pe>=days[0]&&r.ps<=days[20])add(k,{s:r.ps,e:r.pe,cls:'p',n:r.n});if(r.as&&r.ae>=days[0]&&r.as<=days[20])add(k,{s:r.as,e:r.ae,cls:'r',n:''})}
  if(p.imp)for(const w of p.imp.works.filter(w=>w.plan&&w.plan>=days[0]&&w.plan<=days[20]))add(w.kubun||w.kind,{s:w.plan,e:w.plan,cls:w.closed?'r':'p',n:w.no});
  for(const x of p.week.filter(x=>x.d>=days[0]&&x.d<=days[20]))add('手入力の予定',{s:x.d,e:x.d,cls:'p',n:x.t});
  const tot=21,cx=d=>diff(d,days[0]);
  const cls=d=>{const g=new Date(d+'T00:00:00').getDay();return g===0?'sun':g===6?'sat':''};
  const hd=days.map(d=>`<th class="${cls(d)}">${new Date(d+'T00:00:00').getDate()}</th>`).join('');
  const hy=days.map(d=>`<th class="${cls(d)}">${'日月火水木金土'[new Date(d+'T00:00:00').getDay()]}</th>`).join('');
  const bg=`<table class="wk3" style="position:absolute;inset:0;width:100%;height:100%;border:0;min-width:0"><tr>${days.map(d=>`<td class="${cls(d)}"></td>`).join('')}</tr></table>`;
  const bar=it=>{const a=Math.max(0,cx(it.s)),e=Math.min(20,cx(it.e))+1;return `<div class="b ${it.cls}" style="left:${a/tot*100}%;width:${(e-a)/tot*100}%"><span>${esc(it.n)}</span></div>`};
  let body='';for(const [k,items] of rowsMap)body+=`<tr><td class="lb">${esc(k)}</td><td class="tk" colspan="21"><div class="tr">${bg}${items.map(bar).join('')}</div></td></tr>`;
  if(!rowsMap.size)body=`<tr><td class="lb">（工種の予定なし）</td><td class="tk" colspan="21"><div class="tr">${bg}</div></td></tr>`;
  // 書類・検査・閉所・打合せ・立会
  const docsIn=p.docs.filter(d=>d.due>=days[0]&&d.due<=days[20]&&d.status!=='該当なし');
  const subIn=p.docs.filter(d=>d.submitted>=days[0]&&d.submitted<=days[20]);
  const line=(label,fn)=>`<tr><td class="lb">${label}</td>${days.map(d=>`<td class="${cls(d)} hol">${fn(d)}</td>`).join('')}</tr>`;
  const kbOn=(d,kb)=>W.filter(x=>x.kb===kb&&x.s<=d&&x.e>=d);
  const marks=(d,kb,mark)=>kbOn(d,kb).length?mark:'';
  const docCell=d=>[...docsIn.filter(x=>x.due===d).map(x=>`<span title="${esc(x.name)}" style="color:#000">■</span>`),...subIn.filter(x=>x.submitted===d).map(x=>`<span title="${esc(x.name)}提出" style="color:#D00">■</span>`),...kbOn(d,'書類').map(x=>`<span title="${esc(x.n)}">■</span>`)].join('');
  const holCell=d=>{const h=kbOn(d,'閉所');if(h.length)return '休日<br>○';return new Date(d+'T00:00:00').getDay()===0?'休日':''};
  const memo=kb=>[0,1,2].map(i=>`<td class="txt ${i===1?'on':''}" colspan="7">${W.filter(x=>x.kb===kb&&wkOf(x.s)===i).map(x=>`・${esc(x.n)}`).join('<br>')}</td>`).join('');

  const docList=[...docsIn.map(x=>`■ ${fmt(x.due)} 期限 ${esc(x.name)}`),...subIn.map(x=>`<span style="color:#D00">■</span> ${fmt(x.submitted)} 提出 ${esc(x.name)}`)].join('<br>');

const SH={handle:null,file:'shorui-kanri_共有データ.json',dirty:false,lastText:'',status:'未接続',at:'',timer:null,busy:false,remote:null};
const idb={open:()=>new Promise((ok,ng)=>{const r=indexedDB.open('shorui-kanri',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)}),
  get:async k=>{const db=await idb.open();return new Promise(ok=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})},
  set:async(k,v)=>{const db=await idb.open();return new Promise(ok=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok()})}};
const canShare=()=>!!window.showDirectoryPicker;
async function pickShare(){
  if(!canShare()){toast('この機能はPCのChrome／Edgeで、https のURLから開いたときだけ使えます');return}
  try{const hd=await window.showDirectoryPicker({mode:'readwrite'});await idb.set('dir',hd);SH.handle=hd;SH.status='接続';await syncShare(true);startShare();render();toast('共有フォルダに接続しました')}catch(e){if(e.name!=='AbortError')toast('接続できません：'+e.message)}
}
async function restoreShare(){
  if(!canShare())return;const hd=await idb.get('dir');if(!hd)return;SH.handle=hd;
  const q=await hd.queryPermission({mode:'readwrite'});if(q==='granted'){SH.status='接続';await syncShare(true);startShare()}else{SH.status='再接続が必要';toast('共有フォルダの再接続が必要です（工事情報タブ）')}render();
}
async function reconnectShare(){const hd=SH.handle;if(!hd)return pickShare();const q=await hd.requestPermission({mode:'readwrite'});if(q==='granted'){SH.status='接続';await syncShare(true);startShare();render()}}
function disconnectShare(){SH.handle=null;SH.status='未接続';idb.set('dir',null);clearInterval(SH.timer);render()}
function startShare(){clearInterval(SH.timer);SH.timer=setInterval(()=>syncShare(false),5000)}
async function readShare(){let fh;try{fh=await SH.handle.getFileHandle(SH.file)}catch(e){if(e.name==='NotFoundError')return null;throw e}const f=await fh.getFile();return await f.text()}
async function writeShare(text){const fh=await SH.handle.getFileHandle(SH.file,{create:true});const w=await fh.createWritable();await w.write(text);await w.close()}
async function syncShare(force){
  if(!SH.handle||SH.busy)return;SH.busy=true;
  try{
    const text=await readShare();
    let changed=false,R=null;
    if(text===''){SH.busy=false;return}
    if(text!==null&&text!==SH.lastText){try{R=JSON.parse(text)}catch(e){SH.busy=false;return}
      if(R&&R.projects){changed=mergeInto(S,R);SH.lastText=text;SH.remote={by:R.savedBy||'',at:R.savedAt||'',n:R.projects.length}}}
    const mine=JSON.stringify({projects:S.projects,delProj:S.delProj||[]});
    const theirs=R?JSON.stringify({projects:R.projects,delProj:R.delProj||[]}):null;
    if(SH.dirty||force||text===null||(theirs!==null&&theirs!==mine)){const out={projects:S.projects,delProj:S.delProj||[],savedAt:now(),savedBy:S.me||''};const t=JSON.stringify(out);await writeShare(t);SH.lastText=t;SH.remote={by:out.savedBy,at:out.savedAt,n:out.projects.length};SH.dirty=false}
    SH.at=new Date().toLocaleTimeString('ja-JP');SH.status='接続';
    if(changed){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
    else{const el=document.getElementById('shStatus');if(el)el.textContent=shareLabel()}shChip();
  }catch(e){SH.status='エラー：'+e.message;const el=document.getElementById('shStatus');if(el)el.textContent=shareLabel();shChip()}
  SH.busy=false;
}
function shChip(){const el=document.getElementById('shChip');if(!el)return;const st=SH.handle?SH.status:'未接続';const bad=st!=='接続';el.textContent='共有 '+(st.startsWith('エラー')?'エラー':st)+(st==='接続'&&SH.remote?`（${SH.remote.by||'名前未設定'}）`:'');el.style.background=bad?'#fde8e8':'';el.style.color=bad?'#b42318':'';el.style.borderColor=bad?'#f0b4b4':''}
function shareLabel(){if(!SH.handle)return '共有フォルダ 未接続';let s=`共有フォルダ ${SH.status}${SH.at?'　最終同期 '+SH.at:''}`;if(SH.remote)s+=`　｜ 共有ファイル：工事${SH.remote.n}件（最終保存 ${SH.remote.by||'名前未設定'} ${SH.remote.at?new Date(SH.remote.at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}）`;return s}
/* マージ：id ごとに更新時刻の新しい方。削除は del リストで伝える */
function newer(a,b){return (b&&b.u||'')>(a&&a.u||'')}
function mergeList(local,remote,del){const m=new Map(local.map(x=>[x.id,x]));let ch=false;
  for(const r of remote){if(del.has(r.id))continue;const l=m.get(r.id);if(!l){m.set(r.id,r);ch=true}else if(newer(l,r)){m.set(r.id,r);ch=true}}
  for(const id of del){if(m.has(id)){m.delete(id);ch=true}}
  return {list:[...m.values()],ch}}
function mergeInto(S,R){
  fixSt(R);fixDup(R);let ch=false;const delP=new Set([...(S.delProj||[]),...(R.delProj||[])]);S.delProj=[...delP];
  for(const rp of R.projects){if(delP.has(rp.id))continue;let lp=S.projects.find(p=>p.id===rp.id);
    if(!lp){S.projects.push(rp);ch=true;continue}
    const del=new Set([...(lp.del||[]),...(rp.del||[])]);lp.del=[...del];lp.removed=[...new Set([...(lp.removed||[]),...(rp.removed||[])])];
    if((rp.pu||'')>(lp.pu||'')){for(const k of ['name','client','awardDate','recycleOkDate','hoshoDate','contractDate','startDate','endDate','agent','engineer','members','catNames','tokki','pu','pby'])lp[k]=rp[k];ch=true}
    let r=mergeList(lp.docs,rp.docs||[],del);lp.docs=r.list;ch=ch||r.ch;
    r=mergeList(lp.kotei,rp.kotei||[],del);lp.kotei=r.list;ch=ch||r.ch;
    r=mergeList(lp.week,rp.week||[],del);lp.week=r.list;ch=ch||r.ch;
    if(rp.sched&&(rp.sched.u||'')>(lp.sched&&lp.sched.u||'')){lp.sched=rp.sched;ch=true}
    if(rp.imp&&(rp.imp.u||'')>(lp.imp&&lp.imp.u||'')){lp.imp=rp.imp;ch=true}
    if(ch)recalc(lp);
  }
  for(const id of delP){if(S.projects.some(p=>p.id===id)){S.projects=S.projects.filter(p=>p.id!==id);ch=true}}
  if(!S.cur||!S.projects.find(p=>p.id===S.cur))S.cur=S.projects[0]?.id||null;
  return ch;
}

/* 現場アプリJSONの読み取り（項目名は推定。実データで確定させる） */
function pick(o,keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k]}return ''}
function findArr(o,keys){for(const k of keys){if(o&&Array.isArray(o[k]))return o[k]}return null}
function analyzeGenba(j){
  const site=j.site||j.genba||j;
  let ledgers=findArr(j,['ledgers','poles','kanri','items','daicho'])||findArr(site,['ledgers','poles','kanri','items','daicho'])||[];
  if(!ledgers.length){ // 深さ2までで「管理番号らしい」配列を探す
    for(const v of Object.values(j)){if(Array.isArray(v)&&v.length&&typeof v[0]==='object'&&Object.keys(v[0]).some(k=>/no|kanri|管理番号|id/i.test(k))&&Object.keys(v[0]).some(k=>/works|sagyo|作業|jobs/i.test(k))){ledgers=v;break}
      if(v&&typeof v==='object'&&!Array.isArray(v))for(const vv of Object.values(v)){if(Array.isArray(vv)&&vv.length&&typeof vv[0]==='object'&&Object.keys(vv[0]).some(k=>/works|sagyo|作業|jobs/i.test(k))){ledgers=vv;break}}
      if(ledgers.length)break}
  }
  let photos=0;const cnt=x=>{if(typeof x==='string'){if(x.startsWith('data:image'))photos++}else if(Array.isArray(x))x.forEach(cnt);else if(x&&typeof x==='object')Object.values(x).forEach(cnt)};cnt(j);
  const L=[],W=[];
  for(const l of ledgers){
    const no=pick(l,['no','kanriNo','id','管理番号','num','number']);
    const led=l.ledger||l.daicho||l;
    L.push({no,route:pick(led,['route','rosen','路線']),lamp:pick(led,['newLamp','newFixture','lampNew','新設灯具','fixture']),updated:pick(led,['updated','koshin','更新年月日'])});
    const ws=findArr(l,['works','sagyo','jobs','作業'])||[];
    for(const w of ws){
      const pre=w.pre||w.chakushu||w.seko?.pre||{};
      W.push({no,route:pick(led,['route','rosen','路線']),kind:pick(w,['kind','koushu','工種','type']),kubun:pick(w,['kubun','content','sagyoNaiyo','作業内容','work']),
        plan:pick(pre,['date','planDate','sekoDate'])||pick(w,['planDate','sekoDate','施工予定日','plan']),closed:!!pick(w,['closed','done','完了']),
        kyogi:JSON.stringify(w).includes('要協議'),meas:!!(w.meas||w.sokutei||w.測定)});
    }
  }
  return {at:new Date().toLocaleString('ja-JP'),name:pick(site,['name','siteName','工事名','genbaName'])||pick(j,['name','siteName']),format:j.format||'?',version:j.version||'?',keys:Object.keys(j).slice(0,20),ledgers:L,works:W,photos};
}
function importGenba(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const p=P();p.imp=analyzeGenba(j);p.imp.u=now();save();render();toast(`管理番号 ${p.imp.ledgers.length}件・作業 ${p.imp.works.length}件を読み取りました`)}catch(e){toast('読み込めませんでした：'+e.message)}};r.readAsText(f)}

}
function contractHint(p){const c=[p.recycleOkDate,p.hoshoDate].filter(Boolean).sort();if(!c.length)return '';const d=c[c.length-1];return p.contractDate?'':`（見込み ${fmt(d)}＝承認日と保証取得日の遅い方 <a href="#" onclick="pupd('contractDate','${d}');return false">この日にする</a>）`}
function setCat(c,v){const p=P();p.catNames=p.catNames||{};if(v.trim())p.catNames[c]=v.trim();else delete p.catNames[c];p.pu=now();save();render()}
function pupd(k,v){const p=P();p[k]=v;p.pu=now();p.pby=S.me||'';recalc(p);save();render()}
function addMissing(p,quiet){p=p||P();let n=0;for(const t of TPL){if(t.rule==='M')continue;if((p.removed||[]).includes(t.id))continue;if(!p.docs.some(d=>d.tid===t.id)){p.docs.push(mkDoc(t,p));n++}}recalc(p);save();if(!quiet){render();toast(`${n}件追加`)}return n}
function delProj(){const p=P();if(!confirm(`「${p.name}」の書類・工程データをすべて削除します。よろしいですか？`))return;(S.delProj=S.delProj||[]).push(p.id);S.projects=S.projects.filter(x=>x.id!==p.id);S.cur=S.projects[0]?.id||null;save();render()}
function openProjForm(){
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<div class="top"><h2>工事を登録</h2><button class="btn s" onclick="closeSheet()">閉じる</button></div>
  <label class="f"><span>工事名</span><input type="text" id="pf_name" placeholder="令和8年度 南部国道管内道路照明施設設置外工事"></label>
  <label class="f"><span>発注者</span><input type="text" id="pf_client" value="沖縄総合事務局 南部国道事務所"></label>
  <div class="grid2">
   <label class="f"><span>落札決定日</span><input type="date" id="pf_aw"></label>
   <label class="f"><span>契約日（未確定なら空欄）</span><input type="date" id="pf_c"></label>
   <label class="f"><span>着工日</span><input type="date" id="pf_s"></label>
   <label class="f"><span>工期末</span><input type="date" id="pf_e"></label>
   <label class="f"><span>現場代理人</span><input type="text" id="pf_a"></label>
  </div>
  <button class="btn p" onclick="submitProj()">標準書類一式を作って登録</button>
  <div class="muted small" style="margin-top:8px">登録後に「工事情報」で日付を変えれば期限は再計算されます</div>`;
  sh.classList.add('on');document.getElementById('sheetBg').classList.add('on');
}
function submitProj(){const g=id=>document.getElementById(id).value;if(!g('pf_name').trim()){toast('工事名を入れてください');return}
  newProject({name:g('pf_name').trim(),awardDate:g('pf_aw'),client:g('pf_client'),contractDate:g('pf_c'),startDate:g('pf_s'),endDate:g('pf_e'),agent:g('pf_a')});closeSheet();S.tab='home';render();toast('標準書類一式を登録しました')}
function selProj(id){S.cur=id;save();render()}

document.getElementById('ver').textContent=VER;document.title='道路照明 書類管理アプリ '+VER;load();if(S.cur&&!P())S.cur=S.projects[0]?.id||null;render();restoreShare();
</script>
