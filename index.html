<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>道路照明 現場アプリ</title>
<!-- v97：チェックリスト1枚目を見やすく（状態の帯、①〜③に作業日・進捗バー、✔▲✕の色付きマーク、施工の残り項目表示）。v96：「現場を選ぶ」の各行に削除ボタン（2段階確認）。v95：現調 配管・配線に「配管サイズの選定」（④のケーブル外径から占積率で配管の最小サイズを計算・反映、②の配管の判定）。v94：完了時に台帳へ反映（灯具型式・ランプ・更新年月日・ポール型式・基礎形式）。管理番号一覧・作業一覧に削除ボタン。v93：応急点検・現調の最後に「LED灯具の選定」（LED灯具取替に派生するとき。候補・仕様書ライブラリの型式から選び、台帳の新設灯具に保存）。v92：応急点検から派生した作業は「現調」タブ・見出しを「応急点検」に。v91：各工種の最後に「完了」ボタン（派生した作業がない場合のみ。完了後は派生不可・状態は完了）。v90：施工の工程から測定値の行を外し「測定・試験（品質管理）」に一本化。v89：図ライブラリの図は1枚。図の上で部位の位置を囲んで登録し、取替等をした部位だけ赤で示す。備考の全文ページを廃止 -->
<style>
:root{
  --ink:#0F2438;--ink2:#41566A;--line:#DAE2E8;--bg:#fff;--surface:#F3F7F9;
  --ok:#12704A;--ok-bg:#E4F2EA;--warn:#B4470F;--warn-bg:#FBEBDF;--na:#6E7C87;--na-bg:#EDF1F3;
  --rule:#F2B705;--r:10px;
  --s0:#9AA8B2;--s1:#4A78B5;--s2:#B4470F;--s3:#7A5AF5;--s4:#C99A06;--s5:#12704A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:16px;line-height:1.5}
input,textarea,select,button{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],textarea,select{
  width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px;min-height:44px}
textarea{min-height:64px;resize:vertical}
::placeholder{color:#9AA8B2}
label.lb{display:block;font-size:12.5px;color:var(--ink2);font-weight:600;margin:8px 0 4px}

header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:3px solid var(--rule);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center;gap:10px}
.back{background:rgba(255,255,255,.16);border:0;color:#fff;font-size:15px;font-weight:800;padding:0 12px 0 8px;min-height:40px;border-radius:10px;white-space:nowrap}
.back:empty{display:none}
.hd-t{flex:1;min-width:0}
.hd-t .t{font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-t .s{font-size:12px;color:#B9C9D6}
.hd-b{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:9px 12px;font-size:14px;font-weight:600;white-space:nowrap}

main{padding-bottom:110px}
.warnbar{background:var(--warn-bg);color:var(--warn);font-size:13px;padding:9px 14px;border-bottom:1px solid var(--line)}
.pad{padding:12px 14px}
.note{font-size:13px;color:var(--ink2);padding:0 14px 10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add{width:100%;min-height:46px;border:1px dashed var(--ink2);background:#fff;border-radius:var(--r);font-weight:700;color:var(--ink)}
.btn{min-height:44px;border-radius:var(--r);border:1px solid var(--line);background:#fff;font-weight:700;padding:0 14px}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sm{min-height:36px;font-size:13.5px;padding:0 10px}
.del{background:none;border:0;color:var(--na);font-size:13px;padding:4px}

/* リスト */
.list-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid #EFF3F5;background:#fff;width:100%;border-top:0;border-left:0;border-right:0;text-align:left}
.list-item:active{background:var(--surface)}
.li-main{flex:1;min-width:0}
.li-t{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.stt{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.chev{width:9px;height:9px;border-right:2px solid var(--na);border-top:2px solid var(--na);transform:rotate(45deg);flex:0 0 auto}

.chips{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:15}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .n{opacity:.75;margin-left:4px;font-weight:400}

/* 灯柱カード */
.pole-head{padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.pole-head .no{font-size:20px;font-weight:800}
.pole-head .meta{font-size:13px;color:var(--ink2)}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
.tabs button{flex:1;min-height:46px;border:0;background:none;font-weight:700;font-size:14px;color:var(--ink2);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rule)}
.tabs button .b{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--warn);color:#fff;font-size:11px;margin-left:3px;line-height:18px}

.sec{border-bottom:1px solid var(--line)}
.sec-hd{width:100%;display:flex;align-items:center;gap:10px;background:var(--surface);border:0;border-left:5px solid var(--ink);padding:12px 14px;text-align:left}
.sec-hd .nm{font-weight:700;font-size:15px;flex:1}
.sec-hd .st{font-size:12.5px;color:var(--ink2)}
.sec-hd .st b{color:var(--warn)}
.sec-hd.done{border-left-color:var(--ok)}
.caret{width:10px;height:10px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin-top:-4px}
.sec.open .caret{transform:rotate(-135deg);margin-top:3px}
.sec-body{display:none}
.sec.open .sec-body{display:block}
.item{padding:11px 14px;border-top:1px solid #EFF3F5}
.item .q{font-size:15px;margin-bottom:8px;display:flex;gap:8px}
.item .q .txt{flex:1}
.item.hot{background:#FFF8E1}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:var(--r);font-size:14px;font-weight:600;color:var(--ink2);padding:0 4px}
.seg button[aria-pressed="true"][data-hmode],.seg button[aria-pressed="true"][data-cmode]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button[aria-pressed="true"][data-v="reuse"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="none"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="yes"],.seg button[aria-pressed="true"][data-v="day"],.seg button[aria-pressed="true"][data-v="check"]{background:#FFF3C4;border-color:#C99A06;color:#7A5C00}
.seg button[aria-pressed="true"][data-v="ok"],.seg button[aria-pressed="true"][data-v="done"],.seg button[aria-pressed="true"][data-v="todo"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.seg button[aria-pressed="true"][data-v="ok"],.seg button[aria-pressed="true"][data-v="done"],.seg button[aria-pressed="true"][data-v="lane"],.seg button[aria-pressed="true"][data-v="walk"],.seg button[aria-pressed="true"][data-skp],.seg button[aria-pressed="true"][data-skgv]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="warn"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--na-bg);border-color:var(--na);color:var(--na)}
.sub{display:flex;gap:8px;margin-top:8px}
.sub input{flex:1;min-width:0}
.sub input.ph{flex:0 0 100px}
.judge{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13.5px}
.judge b.ok{color:var(--ok)}.judge b.ng{color:var(--warn)}.judge b.nd{color:var(--na)}
.inherit{margin:12px 14px 0;padding:10px 12px;background:#FFF8E1;border:1px solid #F2D77A;border-radius:var(--r);font-size:13.5px}
.inherit b{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.inherit .x{color:var(--warn);font-weight:700}
.rowc{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 14px 12px}
.rowc .no{font-size:12.5px;font-weight:700;color:var(--ink2);display:flex;justify-content:space-between;margin-bottom:4px}
.doneat{font-size:12px;color:var(--ink2);margin-top:6px}

/* 写真 */
.picrow{display:flex;align-items:flex-start;gap:8px;margin-top:8px;flex-wrap:wrap}
.picbtn{border:1px solid var(--line);background:#fff;border-radius:8px;min-height:40px;padding:0 12px;font-size:13.5px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.picbtn .cam{width:15px;height:12px;border:1.6px solid var(--ink2);border-radius:2px;position:relative;display:inline-block}
.picbtn .cam::before{content:'';position:absolute;left:4px;top:-4px;width:6px;height:3px;border:1.6px solid var(--ink2);border-bottom:0;border-radius:2px 2px 0 0}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 14px 12px}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.viewer{position:fixed;inset:0;z-index:70;background:#0B1722;display:none;flex-direction:column}
.viewer.open{display:flex}
.viewer .vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vt{color:#B9C9D6;font-size:13px;text-align:center}
.vbar{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.vbar button{flex:1;min-height:46px;border-radius:var(--r);border:0;font-weight:700;font-size:14px;background:rgba(255,255,255,.14);color:#fff}
.vbar .danger{background:var(--warn)}

/* 下部バー・シート */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bar button{flex:1;min-height:48px;border-radius:var(--r);font-weight:700;font-size:15px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(15,36,56,.45);display:none}
.sheet.open{display:block}
.sheet-in{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;border-radius:16px 16px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-size:17px;margin:0 0 12px}
.sheet .close{position:absolute;right:12px;top:12px;background:none;border:0;font-size:15px;color:var(--ink2)}
.menu button{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid #EFF3F5;padding:14px 4px;font-size:15.5px;font-weight:600}
.menu button small{display:block;font-size:12.5px;color:var(--ink2);font-weight:400}
pre.out{white-space:pre-wrap;word-break:break-all;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px;line-height:1.6;max-height:46vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.empty{padding:40px 20px;text-align:center;color:var(--ink2);font-size:14.5px}
.qt{width:100%;border-collapse:collapse;font-size:13.5px}
.qt th{background:var(--surface);font-weight:700;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.qt td{padding:6px 8px;border-bottom:1px solid #EFF3F5;vertical-align:middle}
.qt td input{min-height:40px;padding:6px 8px;width:100%;min-width:70px}
.qt .sm{font-size:11.5px;color:var(--ink2)}
.jd{font-weight:700}.jd.ok{color:var(--ok)}.jd.ng{color:var(--warn)}.jd.nd{color:var(--na)}
.judge b.ok{color:var(--ok)}.judge b.ng{color:var(--warn)}.judge .nd{color:var(--na)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ok)}

@media print{
  header,.chips,.tabs,.bar,.sheet,.del,.add,.picbtn,.viewer,.toast{display:none!important}
  .sec-body{display:block!important}
  body{font-size:11pt}
  .item{page-break-inside:avoid}
  .thumbs img{width:50mm;height:auto}
}

/* ====== UI 2.0：見やすさ・直感操作 ====== */
:root{ --ink:#17202A; --ink2:#5B6B7B; --line:#E1E7ED; --surface:#F3F6F9; --ok:#1E8A5A; --ok-bg:#E3F4EB; --warn:#D9480F; --warn-bg:#FDEBE0; --na:#8A96A3; --na-bg:#EEF1F4; --todo:#2F6FE4; --todo-bg:#EAF1FE; --r:12px; }
body{font-size:16.5px;line-height:1.5}
header{padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:4px solid var(--rule)}
.hd-t .t{font-size:17.5px}
.hd-b{min-height:40px;padding:0 14px;border-radius:10px;font-size:14.5px}
.back{font-size:15.5px}
main{padding-bottom:140px}

/* セクション＝カード */
.sec{margin:12px 12px 0;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.sec:last-of-type{margin-bottom:12px}
.sec-hd{background:#fff;border-left:0;padding:14px 14px;gap:12px;align-items:center}
.sec-hd .nm{font-size:17px;font-weight:800;letter-spacing:.01em}
.sec-hd .st{font-size:13px;color:var(--ink2);background:var(--surface);padding:4px 10px;border-radius:999px;white-space:nowrap}
.sec-hd .st b{color:var(--warn)}
.sec-hd.done{background:var(--ok-bg)}
.sec-hd.done .nm{color:var(--ok)}
.sec-hd.done .st{background:#fff}
.sec.open .sec-hd{border-bottom:1px solid var(--line)}
.caret{width:11px;height:11px;border-color:var(--ink2)}

/* 項目：未入力は左に青い帯、入力済みは静かに */
.item{padding:14px 14px 14px 18px;border-top:1px solid #EDF1F5;position:relative}
.item::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 3px 3px 0;background:var(--todo);opacity:.9}
.item.answered::before{background:transparent}
.item.answered{background:#FBFCFD}
.item.answered .q .txt{color:#3B4854}
.item .q{margin-bottom:10px}
.item .q .txt{font-size:16px;font-weight:700;line-height:1.45}
.item.hot{background:#FFF6D6}
.note{font-size:13.5px}
.item .note{padding-left:0;padding-right:0}

/* 3択・2択ボタン：大きく、選択は塗りつぶし */
.seg{gap:8px}
.seg button{min-height:50px;font-size:15.5px;font-weight:700;border-radius:12px;border:1.5px solid var(--line);color:var(--ink2);background:#fff;padding:0 6px}
.seg button[aria-pressed="true"]{box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.seg button[aria-pressed="true"][data-v="ok"],.seg button[aria-pressed="true"][data-v="done"],.seg button[aria-pressed="true"][data-v="lane"],.seg button[aria-pressed="true"][data-v="walk"],.seg button[aria-pressed="true"][data-v="none"],.seg button[aria-pressed="true"][data-v="reuse"],.seg button[aria-pressed="true"][data-skp],.seg button[aria-pressed="true"][data-skgv],.seg button[aria-pressed="true"][data-v="有"][data-elt],.seg button[aria-pressed="true"][data-l="無"][data-ex]:not([data-v="warn"]),.seg button[aria-pressed="true"][data-v="ok"][data-ex]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="warn"],.seg button[aria-pressed="true"][data-v="todo"],.seg button[aria-pressed="true"][data-v="warn"][data-ex]{background:var(--warn);border-color:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="na"],.seg button[aria-pressed="true"][data-v="該当なし"]{background:var(--na);border-color:var(--na);color:#fff}
.seg button[aria-pressed="true"][data-v="yes"],.seg button[aria-pressed="true"][data-v="day"],.seg button[aria-pressed="true"][data-v="check"]{background:#E0A800;border-color:#E0A800;color:#1a1400}
.seg button[aria-pressed="true"][data-hmode],.seg button[aria-pressed="true"][data-cmode],.seg button[aria-pressed="true"][data-vdkind],.seg button[aria-pressed="true"][data-shosa="none"],.seg button[aria-pressed="true"][data-ps="kind"],.seg button[aria-pressed="true"][data-elk],.seg button[aria-pressed="true"][data-dg][data-dgf="kind"],.seg button[aria-pressed="true"][data-bk="trip"][data-v="無"],.seg button[aria-pressed="true"][data-bk="v1"][data-v="有"],.seg button[aria-pressed="true"][data-bk="v2"][data-v="有"],.seg button[aria-pressed="true"][data-bk="damage"][data-v="無"],.seg button[aria-pressed="true"][data-bk="cableBreak"][data-v="無"],.seg button[aria-pressed="true"][data-bk="upTrip"][data-v="無"],.seg button[aria-pressed="true"][data-ps][data-v="有"],.seg button[aria-pressed="true"][data-ps="damage"][data-v="無"],.seg button[aria-pressed="true"][data-ap="hood"][data-v="有"],.seg button[aria-pressed="true"][data-ap][data-v="無"]:not([data-ap="hood"]),.seg button[aria-pressed="true"][data-bd][data-v="無"],.seg button[aria-pressed="true"][data-rd="有"],.seg button[aria-pressed="true"][data-bdoc][data-v="done"],.seg button[aria-pressed="true"][data-iv][data-v="ok"]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg button[aria-pressed="true"][data-bk][data-v="有"]:not([data-bk="v1"]):not([data-bk="v2"]),.seg button[aria-pressed="true"][data-bk="v1"][data-v="無"],.seg button[aria-pressed="true"][data-bk="v2"][data-v="無"],.seg button[aria-pressed="true"][data-ps][data-v="無"]:not([data-ps="damage"]),.seg button[aria-pressed="true"][data-ps="damage"][data-v="有"],.seg button[aria-pressed="true"][data-ap="hood"][data-v="無"],.seg button[aria-pressed="true"][data-ap][data-v="有"]:not([data-ap="hood"]),.seg button[aria-pressed="true"][data-bd][data-v="有"],.seg button[aria-pressed="true"][data-rd="無"],.seg button[aria-pressed="true"][data-bdoc][data-v="todo"],.seg button[aria-pressed="true"][data-iv][data-v="warn"],.seg button[aria-pressed="true"][data-shosa="warn"]{background:var(--warn);border-color:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-ps="stock"][data-v="未確認"],.seg button[aria-pressed="true"][data-bdoc][data-v="na"],.seg button[aria-pressed="true"][data-iv][data-v="na"]{background:var(--na);border-color:var(--na);color:#fff}

/* 入力欄 */
input[type=text],input[type=number],input[type=date],input[type=url],textarea,select{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:48px;font-size:16px;background:#fff}
input:focus,textarea:focus,select:focus{outline:2px solid var(--todo);outline-offset:1px;border-color:var(--todo)}
label.lb{font-size:13px;margin-top:10px}
.sub{gap:8px;margin-top:8px}
.rowc{border-radius:12px;padding:12px;background:#FAFBFC}
.rowc .no{font-size:13px}

<script>
/* =====================================================================
   データ形式（全体管理アプリとの受け渡し用）  format: "dl-genba" version: 5（upd＝管理番号・作業ごとの更新日時、from＝送信元端末、partial＝変更分のみ）
   site: {id,name,place,period,by,updated,settings:{ins,earth,torque},poles:[pole]}

   job: {id,kind,work,date,parent,survey,kyogi,seko,meas,pics,memo,insp:{start,end,crew,base,travel,items,cause,result,report}}
   pole: {id,no,route,line,kp,addr,ledger:{...},attach:[{id,name,type:'img'|'pdf',at}],jobs:[job],history:[{at,src,jobId,jobLabel,field,label,from,to}]}  （旧: survey/kyogi/seko/meas/pics は job へ自動移行）
   ledger: height/armLen/hikikomi/maker は選択値または 'その他'（xxxOther に自由記入）。kansei=既設の更新年月日、watt=電力申請番号、mapUrl=Googleマップ
          ※ no=管理番号 route=路線 line=上り線/中央/下り線 kp=距離標
          kyogi:{rows:[{target,design,actual,cause,action,photo}],docNo,tachiai},
          seko:{itemId:{v,at}},meas:{ins,earth,torque,lux},pics:[{id,tag,at}],memo}
   site.perf: [{id,name,type,target,lanes,span,M,K,vals,memo}]  照度測定（性能確認）
   site.elb: [{id,ban,kairo,sens,time,test,memo}]  ELB動作確認
   site.conc: [{id,date,place,vol,haigo,slump,air,cl,temp,fc7,fc28,memo}]  生コン配合・圧縮試験
   meas に amp（電流A）, plumb（'良'|'否'）を追加（version 3）。perf に model（器具形式）
   photos: {picId: dataURL}   ※「写真込み」で書き出したときのみ
   version 2: route は ROUTES の値または 'その他'（routeOther に路線名）、ledger に kubun/setchi/kisoType/hikikomi/kansei/angle、meas に volt/volt0 を追加
   ===================================================================== */

/* ============ 定義 ============ */
const LAMP = ['高圧ナトリウムランプ','水銀','LED','蛍光','その他'];
const LAMP_MODELS = {
  '高圧ナトリウムランプ': ['NH360FLS','NHT360LS','NH270FLS','NHT270LS','NH220FLS','NHT220LS','NH180FLS','NHT180LS','NH110FLS','NHT110LS'],
  'LED': ['KCE150-3','KCE150-3C','KCE100-2','KCE100-3','KCE090-2C','KCE070-2','KCE050-2'],
};
function lampModelText(L){ return L.lampModel==='その他' ? (L.lampModelOther||'') : (L.lampModel||''); }
const ARM = ['片側','両側','ストレート'];
const HEIGHTS = ['10m','12m'];
const GAIBU = ['A','B','C'];
const SHOMEI = ['連続照明','交差点（十字路）','交差点（T字路）','交差点（Y字路）','横断歩道'];

/* 器材仕様書 解説表1-1（連続照明）・1-2（局部照明）：既設 高圧ナトリウムランプ → LED器具形式（参考） */
function suggestNewTogu(p){
  const L=p.ledger; const lamp=lampModelText(L); const m=String(lamp).match(/(110|180|220|270|360)/); if(!m) return null;
  const w=m[1], k=L.shomeiKubun||'', ln=L.lanes||'', sumi=L.sumikiri==='1';
  let model=null, ref='';
  if(k==='連続照明'){
    ref='解説表1-1';
    if(w==='220') model = ln==='3' ? 'KCE100-3' : 'KCE100-2';
    else if(w==='270') model = ln==='3' ? 'KCE150-3' : 'KCE120-2H';
    else if(w==='180') model = 'KCE070-2';
    else if(w==='110') model = 'KCE050-2';
  }else if(/交差点/.test(k)){
    ref='解説表1-2';
    if(w==='220') model = sumi ? 'KCE090-2C' : (ln==='6' ? 'KCE100-3' : 'KCE100-2');
    else if(w==='180') model = sumi ? 'KCE070-2C' : (ln==='6' ? 'KCE070-3' : 'KCE070-2');
    else if(w==='110') model = sumi ? 'KCE050-2C' : 'KCE050-2';
  }else if(k==='横断歩道'){
    ref='解説表1-2';
    if(w==='270') model='KCE140-2'; else if(w==='180') model='KCE070-2';
  }else return {model:null, ref:'', note:'照明区分を選ぶと候補が出ます'};
  if(!model) return {model:null, ref, note:'この組合せは表にありません（設計図・数量総括表で確認）'};
  const lj=latestJob(p); const ju = lj && lj.survey && lj.survey.jutaien && lj.survey.jutaien.v==='該当する';
  return {model: model+(ju?'-J':''), ref, note: (ju?'重耐塩仕様':'')};
}
const TOGU = ['KSH-2','KSC-4'];
const ARMLENS = ['1.8m','2.1m'];
const MAKERS = ['(株)MARUWA SHOMEI','岩崎電気株式会社','コイト電工株式会社'];

const ROUTES = ['国道58号','国道330号','国道331号','国道332号','国道506号'];

const SETCHI = ['路側','中央分離帯','歩道'];

  {id:'cable', name:'配管・配線', special:'cable', items:[]},

/* 中継ボックスの目安：最大管径Dの8倍（曲げ部の引き通し寸法）と、管の並び幅（本数×(D+30)+50）の大きい方を一辺とし、候補から最小のものを選ぶ */
function boxGuide(C){
  const rows=(C.pipes||[]).filter(r=>r.size && r.size!=='その他'); if(!rows.length) return null;
  let D=0,n=0; rows.forEach(r=>{ const d=parseFloat(r.size); const k=parseFloat(r.n)||1; if(!isNaN(d)){ D=Math.max(D,d); n+=k; } });
  if(!D) return null;
  const w=Math.max(8*D, n*(D+30)+50);
  const pick=BOX_SIZES.filter(s=>s!=='その他').find(s=>parseFloat(s)>=w) || '600×600×300';
  return {size:pick, D, n, w:Math.ceil(w)};
}

let persistent = true; const mem = {};
const Store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ persistent=false; return mem[k]??null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ persistent=false; mem[k]=v; return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
let PIC = {}; let picDB=null, picOK=true;
function openPicDB(){ return new Promise(res=>{ try{
  const rq=indexedDB.open('dlPhotos',1);
  rq.onupgradeneeded=()=>rq.result.createObjectStore('pics');
  rq.onsuccess=()=>{picDB=rq.result;res(true)};
  rq.onerror=()=>{picOK=false;res(false)};
}catch(e){picOK=false;res(false)} }); }
function picTx(m){ return picDB.transaction('pics',m).objectStore('pics'); }
const picPut=(id,d)=>new Promise(res=>{ if(!picDB){picOK=false;return res(false)} const rq=picTx('readwrite').put(d,id); rq.onsuccess=()=>res(true); rq.onerror=()=>{picOK=false;res(false)}; });
const picGet=id=>new Promise(res=>{ if(!picDB)return res(null); const rq=picTx('readonly').get(id); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); });
const picDel=id=>new Promise(res=>{ delete TH[id]; delete PIC[id]; if(!picDB)return res(false); const st=picTx('readwrite'); st.delete('th:'+id); const rq=st.delete(id); rq.onsuccess=()=>res(true); rq.onerror=()=>res(false); });
const TH={};  // サムネイル（小）だけをメモリに持つ
function makeThumb(dataURL){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const MAX=240; let w=img.width,h=img.height; const r=Math.min(1,MAX/Math.max(w,h)); w=Math.max(1,Math.round(w*r)); h=Math.max(1,Math.round(h*r)); const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/jpeg',0.6)); }; img.onerror=()=>res(null); img.src=dataURL; }); }
async function storeImage(id, dataURL){ await picPut(id, dataURL); const t=await makeThumb(dataURL); if(t){ await picPut('th:'+id, t); TH[id]=t; } }
async function getThumb(id){ if(TH[id]) return TH[id]; let t=await picGet('th:'+id); if(!t){ const full=await picGet(id); if(full && /^data:image/.test(full)){ t=await makeThumb(full); if(t) await picPut('th:'+id,t); } } if(t) TH[id]=t; return t; }
async function getFull(id){ if(PIC[id]) return PIC[id]; const d=await picGet(id); return d; }
function markAnswered(){
  document.querySelectorAll('#main .item').forEach(it=>{
    const seg=it.querySelector(':scope > .seg, :scope > div > .seg');
    let ans=false;
    if(seg){ ans=!!seg.querySelector('button[aria-pressed="true"]'); }
    else { const inp=it.querySelector('input[type=text],input[type=number],input[type=date],select,textarea'); if(inp) ans = Array.from(it.querySelectorAll('input,select,textarea')).some(x=>x.value && x.value!==''); else ans=true; }
    if(it.querySelector('.inherit') && !seg) ans=true;
    it.classList.toggle('answered', ans);
  });
}

function judge(meas, val, p){
  const set = SITE.settings[meas];
  if(meas==='volt'){
    if(val==='' || val==null) return {k:'nd', t:'未測定'};
    const nom=parseFloat(SITE.settings.voltNom||202), tol=parseFloat(SITE.settings.voltTol||20), v=parseFloat(val);

    const ok = inRange && okDrop;

  }

    if(isNaN(r)) return {k:'nd', t:'定格入力電流を現場情報で設定'};

    return dev<=tol ? {k:'ok', t:'良（定格 '+r+'A ±'+tol+'%、偏差 '+dev.toFixed(1)+'%）'} : {k:'ng', t:'不良（定格 '+r+'A ±'+tol+'%、偏差 '+dev.toFixed(1)+'%）'};
  }

    return {k:'nd', t:'未確認'};
  }
  if(val==='' || val==null) return {k:'nd', t:'未測定'};
  if(set==='' || set==null) return {k:'nd', t:'規定値未設定'};
  const v=parseFloat(val), s=parseFloat(set);

}

function parseVals(s){ return String(s||'').split(/[\s,、，]+/).map(x=>parseFloat(x)).filter(x=>!isNaN(x)); }
function perfCalc(r){
  const v=parseVals(r.vals); if(!v.length) return null;
  const avg=v.reduce((a,b)=>a+b,0)/v.length, min=Math.min.apply(null,v);
  const M=parseFloat(r.M), K=parseFloat(r.K), tgt=parseFloat(r.target);

    if(!isNaN(M) && !isNaN(K) && K>0) out.L = avg*M/K;
    out.ok = (out.L!=null && !isNaN(tgt)) ? out.L>=tgt : null;
  }else{
    if(!isNaN(M)) out.E = avg*M;
    const okE = (out.E!=null && !isNaN(tgt)) ? out.E>=tgt : null;
    const okU = out.u0>=0.4;

  return {n:v.length, avg:fmt(avg), max:fmt(Math.max.apply(null,v)), min:fmt(Math.min.apply(null,v))};

function summaryRows(){
  const S=SITE.settings; const ps=qcJobs().map(x=>x.j);
  const out=[];
  const measRow=(key,label,spec,unit)=>{ const st=stats(ps.map(p=>p.meas[key])); const q=qcStat(key); out.push({key,label,spec,unit,n:st.n,avg:st.avg,max:st.max,min:st.min,k:q.n===0?'nd':(q.ng?'ng':'ok')}); };
  ['24-8-20','24-8-40'].forEach(hg=>{
    const C=(SITE.conc||[]).filter(r=>r.haigo===hg); const sfx=hg.slice(-2);
    const push=(key,label,vals,spec,unit,okf)=>{ const st=stats(vals); const ok=vals.map(v=>parseFloat(v)).filter(v=>!isNaN(v)).map(okf); out.push({key:key+sfx,label:label+' '+hg,spec,unit,n:st.n,avg:st.avg,max:st.max,min:st.min,k:ok.length?(ok.every(Boolean)?'ok':'ng'):'nd'}); };
    push('slump','スランプ',C.map(r=>r.slump),S.concSlump+'±'+S.concSlumpTol,'cm',v=>Math.abs(v-parseFloat(S.concSlump))<=parseFloat(S.concSlumpTol));
    push('air','空気量',C.map(r=>r.air),S.concAir+'±'+S.concAirTol,'%',v=>Math.abs(v-parseFloat(S.concAir))<=parseFloat(S.concAirTol));
    push('fc','圧縮強度（28日）',C.map(r=>r.fc28),S.concFc+'以上','N/mm²',v=>v>=parseFloat(S.concFc));
    push('cl','塩化物含有量',C.map(r=>r.cl),S.concCl+'以下','kg/m³',v=>v<=parseFloat(S.concCl));
  });
  measRow('earth','接地抵抗',S.earth+'以下','Ω');
  measRow('ins','絶縁抵抗',S.ins+'以上','MΩ');
  measRow('volt','電源電圧',S.voltNom+'±'+S.voltTol,'V');
  const E=SITE.elb||[]; { const oks=E.map(elbOk).filter(x=>x!=null); const g=oks.filter(Boolean).length; out.push({key:'elb',label:'漏電時作動（テストボタン）',spec:'トリップ',unit:'良・否',n:oks.length,avg:oks.length?('良'+g+(oks.length-g?'／否'+(oks.length-g):'')):'',max:'',min:'',k:oks.length?(g===oks.length?'ok':'ng'):'nd'}); }
  { const vals=ps.map(p=>p.meas.plumb).filter(v=>v==='良'||v==='否'); const g=vals.filter(v=>v==='良').length; out.push({key:'plumb',label:'照明灯鉛直確認',spec:'ポールゲージ範囲内',unit:'良・否',n:vals.length,avg:vals.length?('良'+g+(vals.length-g?'／否'+(vals.length-g):'')):'',max:'',min:'',k:vals.length?(g===vals.length?'ok':'ng'):'nd'}); }
  LUX_MODELS.forEach(m=>{
    const P=(SITE.perf||[]).filter(r=>r.model===m); const vals=[], oks=[];
    P.forEach(r=>{ const c=perfCalc(r); if(!c) return; const v = r.type==='連続照明' ? c.L : c.E; if(v!=null){ vals.push(v); if(c.ok!=null) oks.push(c.ok); } });
    const st=stats(vals); const dft=LUX_DEFAULT[m];
    out.push({key:'lux_'+m,label:'照度測定 '+m,spec:(dft?dft[1]:'')+'以上',unit:dft&&dft[0]==='連続照明'?'cd/m²':'lx',n:st.n,avg:st.avg,max:st.max,min:st.min,k:oks.length?(oks.every(Boolean)?'ok':'ng'):'nd'});
  });
  return out;
}

/* ---- 完了時に台帳へ反映：LED灯具取替→灯具・ランプ・更新年月日、建替・新設→ポール型式・基礎形式も ---- */
function ledgerSet(p,key,val,src){ const L=p.ledger; const from=ledgerDisplay(p,key); if(key in p&&!(key in L)) p[key]=val; else L[key]=val; const to=ledgerDisplay(p,key); if(from===to) return false; p.history=p.history||[]; p.history.push({at:Date.now(),src:src||'完了反映',jobId:null,jobLabel:'',field:key,label:LEDGER_LABEL[key]||key,from,to}); LSNAP[key]=to; return true; }
function ledgerSetLV(p,key,val,list,src){ const L=p.ledger; const from=lv(L,key)||''; if(list.includes(val)){ L[key]=val; L[key+'Other']=''; } else { L[key]='その他'; L[key+'Other']=val; } const to=lv(L,key)||''; if(from===to) return false; p.history=p.history||[]; p.history.push({at:Date.now(),src:src||'完了反映',jobId:null,jobLabel:'',field:key,label:LEDGER_LABEL[key]||key,from,to}); LSNAP[key]=ledgerDisplay(p,key); LSNAP[key+'Other']=ledgerDisplay(p,key+'Other'); return true; }
function applyJobToLedger(p,j){
  const L=p.ledger; const work=j.work||''; const src='完了反映（'+jobLabel(j)+'）'; const changed=[];
  if(j.kind==='応急点検工') return changed;

  if(/LED灯具取替|建替|新設/.test(work) && L.newTogu){
    const m=L.newTogu;
    if(ledgerSetLV(p,'togu',m,TOGU,src)) changed.push('灯具型式');
    if(ledgerSet(p,'lamp','LED',src)) changed.push('ランプ種別');
    if(ledgerSetLV(p,'lampModel',m,LAMP_MODELS.LED||[],src)) changed.push('ランプ形式');
  }

  if(/LED灯具取替|建替|新設|配管配線/.test(work)){ if(ledgerSet(p,'kansei',ymd,src)) changed.push('更新年月日'); }
  syncSpecAttach(p);

}

function closeJobHtml(j){
  const p=pole(); const kids=p.jobs.filter(x=>x.parent===j.id);
  let h='<div class="pad" style="padding-top:4px"><div class="inherit" style="margin:0"><b>この工種の完了</b>';
  if(kids.length) return h+'<div style="font-size:13px">派生した作業（'+kids.map(k=>esc((k.date||'')+' '+jobLabel(k))).join('、')+'）があるため、完了は派生先の作業で行います</div></div></div>';
  if(j.closed){ h+='<div style="font-size:15px;font-weight:800;color:var(--ok)">完了　'+fmtDT(j.closed)+'</div><div style="font-size:13px">これ以上の施工は派生しません。派生ボタンは使えなくなっています</div><button class="btn" data-reopenjob="1" style="width:100%;margin-top:8px">完了を取り消す</button>'; }
  else {
    let warn='';
    if(j.kind==='応急点検工'){ const ip=inspProgress(j); if(!j.insp.end) warn='点検終了が押されていません。'; else if(!reportReady(j)) warn='監督職員への報告①〜③が未記入です。'; else if(ip.total-ip.done>0) warn='点検の未入力が '+(ip.total-ip.done)+' 件あります。'; }
    else { const kp=sekoProgress(j), sp=surveyProgress(j); if(kp.total-kp.done>0) warn='施工の未入力が '+(kp.total-kp.done)+' 件あります。'; else if(sp.total-sp.done>0) warn=survName(j)+'の未入力が '+(sp.total-sp.done)+' 件あります。'; else if(kyogiOpen(j)) warn='協議が未決です。'; }
    h+='<div style="font-size:13px">'+(j.kind==='応急点検工'?'この点検だけで済み、補修・修繕へ派生しない場合に押します。':'この作業で施工が終わり、これ以上の作業が派生しない場合に押します。完了にすると、新設灯具（LED）・ポール型式などを台帳に反映します。')+'</div>'
      + (warn?'<div style="font-size:13px;color:var(--warn);font-weight:600;margin-top:4px">'+warn+'</div>':'')
      + '<button class="btn pri" data-closejob="1" style="width:100%;margin-top:8px">✔ 完了（これ以上の施工は派生しない）</button>';
  }
  return h+'</div></div>';
}
function tabPics(p){
  let h='<div class="pad" style="display:flex;gap:8px;align-items:center"><select id="picTag" style="flex:1">'+TAGS.map(t=>'<option>'+t+'</option>').join('')+'</select><button class="picbtn" id="addPicTag" style="min-height:44px"><span class="cam"></span>写真を追加</button></div>';
  TAGS.forEach(t=>{
    const list=p.pics.filter(x=>x.tag===t);
    if(!list.length) return;
    h+='<div class="note" style="font-weight:700;color:var(--ink)">'+t+'　'+list.length+'枚</div><div class="pgrid">'+list.map(x=>'<img data-pic="'+x.id+'" src="'+(TH[x.id]||'')+'" alt="'+t+'">').join('')+'</div>';
  });
  if(!p.pics.length) h+='<div class="empty">写真はまだありません。</div>';
  return h;
}
function thumbs(p,tag){ return p.pics.filter(x=>x.tag===tag).map(x=>'<img data-pic="'+x.id+'" src="'+(TH[x.id]||'')+'" alt="'+tag+'">').join(''); }

function touch(rerender){
  if(!SITE) return;
  SITE.updated=Date.now();
  { const p=pole(), j=job(); if(p) p.upd=SITE.updated; if(j) j.upd=SITE.updated; }
  $('#hdSub').textContent = '入力中…';
  clearTimeout(saveTimer); saveTimer=setTimeout(save,500);
  if(rerender) render();
}
/* 現場の削除：現場データ・一覧・写真（IndexedDB）を消す */
async function deleteSite(id){
  let site=null; try{ site=JSON.parse(Store.get('dl:site:'+id)||'null'); }catch(e){}
  if(site){ for(const p of (site.poles||[])){ for(const jb of (p.jobs||[])) for(const x of (jb.pics||[])){ delete PIC[x.id]; try{ await picDel(x.id); }catch(e){} } for(const a of (p.attach||[])){ if(!a.spec){ delete PIC[a.id]; try{ await picDel(a.id); }catch(e){} } } } }
  Store.del('dl:site:'+id);
  let idx=[]; try{ idx=JSON.parse(Store.get('dl:index')||'[]'); }catch(e){} Store.set('dl:index',JSON.stringify(idx.filter(x=>x.id!==id)));
  if(Store.get('dl:last')===id) Store.del('dl:last');
  if(SITE&&SITE.id===id){ SITE=null; V.screen='sites'; }
}
function persistSite(s){
  Store.set('dl:site:'+s.id, JSON.stringify(s));
  let idx=[]; try{ idx=JSON.parse(Store.get('dl:index')||'[]'); }catch(e){}
  idx=idx.filter(x=>x.id!==s.id);
  const reports=[]; s.poles.forEach(p=>p.jobs.forEach(j=>{ if(j.kind==='応急点検工' && j.insp.reportWhen && j.insp.reportDone!=='有') reports.push({poleId:p.id,jobId:j.id,no:p.no,when:j.insp.reportWhen,how:j.insp.reportHow==='その他'?(j.insp.reportHowOther||'その他'):j.insp.reportHow,cause:causeText(j),result:resultText(j)}); }));
  idx.unshift({id:s.id,name:s.name,place:s.place,n:s.poles.length,done:s.poles.filter(p=>poleStatus(p)==='done').length,updated:s.updated,reports});
  Store.set('dl:index',JSON.stringify(idx));
}
function save(){
  if(!SITE) return;
  persistSite(SITE);
  Store.set('dl:last',SITE.id);
  $('#storeWarn').hidden=persistent;
  if(V.screen!=='sites'){ $('#hdSub').textContent = (persistent?'保存済 ':'保存できません ')+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}); }
}
async function loadSite(id){
  const raw=Store.get('dl:site:'+id); if(!raw) return false;
  SITE=JSON.parse(raw);
  SITE.poles=SITE.poles.map(migratePole);
  SITE.settings=Object.assign({ins:0.2,earth:100,torque:'',lux:''},SITE.settings||{});
  SITE.poles.forEach(p=>{ const L=p.ledger; if(/^\d+(\.\d+)?$/.test(L.height||'')){ const v=parseFloat(L.height); if(v===10||v===12) L.height=v+'m'; else { L.height='その他'; L.heightOther=v+'m'; } } if(/^\d+(\.\d+)?$/.test(L.armLen||'')){ const v=parseFloat(L.armLen).toFixed(1)+'m'; if(ARMLENS.includes(v)) L.armLen=v; else { L.armLen='その他'; L.armLenOther=v; } } if(L.arm==='ポールトップ') L.arm='ストレート'; if(p.ledger.lamp==='高圧Na') p.ledger.lamp='高圧ナトリウムランプ'; if(p.ledger.lampModel==='KCE100-2.3') p.ledger.lampModel=''; if(p.route && !ROUTES.includes(p.route) && p.route!=='その他'){ p.routeOther=p.route; p.route='その他'; } });
  SITE.perf=SITE.perf||[]; SITE.elb=SITE.elb||[]; SITE.conc=SITE.conc||[]; SITE.orders=SITE.orders||{}; SITE.stock=SITE.stock||{};
  SITE.settings=Object.assign(blankSite().settings, SITE.settings||{});
  PIC={};
  for(const k in TH) delete TH[k];
  return true;
}

function specLib(){ try{ return JSON.parse(Store.get('dl:speclib')||'[]'); }catch(e){ return []; } }
function saveSpecLib(l){ Store.set('dl:speclib', JSON.stringify(l)); }
function specMatches(model){
  const base=String(model||'').replace(/-J$/,'').trim(); if(!base) return [];
  return specLib().filter(s=>String(s.model||'').replace(/-J$/,'').trim()===base);
}
function syncSpecAttach(p){
  const L=p.ledger; p.attach=p.attach||[];
  const want=specMatches(L.newTogu); const maker=lv(L,'maker');
  const pick = want.filter(s=>!s.maker || !maker || s.maker===maker);
  const use = pick.length? pick : want;
  p.attach=p.attach.filter(a=>!a.spec || use.some(s=>s.id===a.id));
  use.forEach(s=>{ if(!p.attach.some(a=>a.id===s.id)) p.attach.push({id:s.id,name:s.name,type:'pdf',spec:true,model:s.model,maker:s.maker||'',at:Date.now()}); });
}

function readAsDataURL(f){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(f); }); }
function openPdf(dataURL, name){
  try{ const b64=dataURL.split(',')[1]; const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); const blob=new Blob([arr],{type:'application/pdf'}); const u=URL.createObjectURL(blob); const wnd=window.open(u,'_blank'); if(!wnd){ const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); } }
  catch(e){ toast('PDFを開けませんでした'); }
}

const LEDGER_COLS=[['no','管理番号'],['route','路線'],['line','上下線'],['kp','距離標'],['addr','住所・場所'],['setchi','設置区分'],['gaibu','外部条件'],['shomeiKubun','照明区分'],['lanes','車線数'],['kansei','既設の更新年月日'],['poleType','ポール型式'],['height','ポール高さ'],['armLen','アーム長'],['arm','アーム'],['kisoType','基礎形式'],['hikikomi','引込方式'],['togu','灯具型式'],['lamp','ランプ種別'],['lampModel','形式'],['watt','電力申請番号'],['newTogu','新設灯具'],['maker','メーカー'],['angle','設計取付角度'],['mapUrl','地図リンク'],['sonota','その他'],['memo','メモ']];
const LEDGER_LABEL=Object.fromEntries(LEDGER_COLS.concat([['sonota','その他'],['routeOther','路線'],['heightOther','ポール高さ'],['armLenOther','アーム長'],['hikikomiOther','引込方式'],['makerOther','メーカー'],['toguOther','灯具型式'],['lampModelOther','形式'],['sumikiri','設置位置']]));
function ledgerDisplay(p,key){
  const base=key.replace(/Other$/,''); const L=p.ledger;
  if(base==='route') return routeText(p);
  if(['no','kp','addr','memo','line'].includes(base)) return p[base]||'';
  if(['height','armLen','hikikomi','maker','togu'].includes(base)) return lv(L,base);
  if(base==='lampModel') return lampModelText(L);
  if(base==='sumikiri') return L.sumikiri==='1'?'隅切り部':'本線';
  return L[base]||'';
}
let LSNAP={};
function snapLedger(p){ LSNAP={}; if(!p) return; Object.keys(LEDGER_LABEL).forEach(k=>{ LSNAP[k.replace(/Other$/,'')]=ledgerDisplay(p,k); }); }

function parseCsv(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(cur); cur=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=c; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}
function setLedgerVal(p,key,val){
  val=String(val||'').trim(); if(!val) return;
  const L=p.ledger; const other=(k,opts)=>{ if(opts.includes(val)) L[k]=val; else { L[k]='その他'; L[k+'Other']=val; } };
  if(['no','kp','addr','memo'].includes(key)) p[key]=val;
  else if(key==='route'){ if(ROUTES.includes(val)) p.route=val; else { p.route='その他'; p.routeOther=val; } }
  else if(key==='line'){ const m=LINES.find(x=>val.includes(x.replace('線',''))); if(m) p.line=m; }
  else if(key==='height'){ const v=val.replace(/[^\d.]/g,''); other('height',HEIGHTS.concat().map(x=>x)); if(HEIGHTS.includes(v+'m')) { L.height=v+'m'; L.heightOther=''; } }
  else if(key==='armLen'){ const v=parseFloat(val); if(!isNaN(v) && ARMLENS.includes(v.toFixed(1)+'m')) L.armLen=v.toFixed(1)+'m'; else other('armLen',ARMLENS); }
  else if(key==='hikikomi') other('hikikomi',HIKIKOMI);
  else if(key==='maker') other('maker',MAKERS);
  else if(key==='togu') other('togu',TOGU);
  else if(key==='lampModel'){ const all=[].concat(...Object.values(LAMP_MODELS)); if(all.includes(val)) L.lampModel=val; else { L.lampModel='その他'; L.lampModelOther=val; } if(!L.lamp){ if(/^KCE/.test(val)) L.lamp='LED'; else if(/^NH/.test(val)) L.lamp='高圧ナトリウムランプ'; } }
  else if(key==='lamp'){ if(/Na|ナトリウム/.test(val)) L.lamp='高圧ナトリウムランプ'; else if(LAMP.includes(val)) L.lamp=val; else L.lamp='その他'; }
  else L[key]=val;
}
async function importLedgerCsv(file){
  try{
    const text=(await file.text()).replace(/^\uFEFF/,''); const rows=parseCsv(text); if(rows.length<2) throw new Error('データ行がありません');
    const head=rows[0].map(x=>String(x).trim()); const map=head.map(hname=>{ const c=LEDGER_COLS.find(([k,l])=>l===hname||k===hname); return c?c[0]:null; });
    if(!map.includes('no')) throw new Error('「管理番号」列が見つかりません');
    let added=0, updated=0;
    rows.slice(1).forEach(r=>{ const noI=map.indexOf('no'); const no=String(r[noI]||'').trim(); if(!no) return;
      let p=SITE.poles.find(x=>x.no===no); if(!p){ p=blankPole(); SITE.poles.push(p); added++; } else updated++;
      map.forEach((k,i)=>{ if(k) setLedgerVal(p,k,r[i]); });
      if(p.ledger.poleType){ const inf=inferFromPoleType(p.ledger.poleType); if(inf.height && !p.ledger.height){ if(inf.height.startsWith('その他:')){ p.ledger.height='その他'; p.ledger.heightOther=inf.height.slice(4); } else p.ledger.height=inf.height; } if(inf.armLen && !p.ledger.armLen) p.ledger.armLen=inf.armLen; }
      syncSpecAttach(p);
    });
    touch(); $('#sheet').classList.remove('open'); V.screen='poles'; render(); toast('追加 '+added+'件、更新 '+updated+'件');
  }catch(e){ toast('取り込めませんでした：'+e.message); }
}

function dl(name, content, type){ const blob=new Blob([content],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }

function sentKey(){ return 'dl:sent:'+SITE.id; }

function changedSince(ts){ return SITE.poles.filter(p=>(p.upd||0)>ts || p.jobs.some(j=>(j.upd||0)>ts)); }
async function buildExport(withPhotos, onlyChanged){
  const since=onlyChanged?lastSent():0;
  const poles=onlyChanged?changedSince(since):SITE.poles;
  const site=Object.assign({},SITE,{poles});
  const out={format:'dl-genba',version:5,exportedAt:new Date().toISOString(),from:devName(),partial:!!onlyChanged,site};
  if(withPhotos){ out.photos={}; let n=0;
    for(const p of poles){ for(const jb of p.jobs) for(const x of jb.pics){ const d=await picGet(x.id); if(d){ out.photos[x.id]=d; n++; } } for(const a of (p.attach||[])){ if(a.spec) continue; const d=await picGet(a.id); if(d){ out.photos[a.id]=d; n++; } } }
    out.photoCount=n;
  }
  return out;
}

/* 取り込みのマージ：管理番号・作業ごとに更新日時（upd）の新しい方を採用。無い側は追加。現場情報・在庫・発注等は現場全体の更新日時で新しい方 */
function mergeSiteData(dst, src){
  const r={pAdd:0,pUpd:0,jAdd:0,jUpd:0};
  if((src.updated||0)>(dst.updated||0)){ ['name','place','period','by','settings','stock','orders','perf','elb','conc'].forEach(k=>{ if(src[k]!==undefined) dst[k]=JSON.parse(JSON.stringify(src[k])); }); }
  (src.poles||[]).forEach(sp0=>{
    const sp=migratePole(sp0); const dp=dst.poles.find(p=>p.id===sp.id);
    if(!dp){ dst.poles.push(sp); r.pAdd++; return; }
    if((sp.upd||0)>(dp.upd||0)){ const jobs=dp.jobs; Object.keys(sp).forEach(k=>{ if(k!=='jobs') dp[k]=sp[k]; }); dp.jobs=jobs; r.pUpd++; }
    sp.jobs.forEach(sj=>{ const dj=dp.jobs.find(j=>j.id===sj.id); if(!dj){ dp.jobs.push(sj); r.jAdd++; } else if((sj.upd||0)>(dj.upd||0)){ Object.keys(dj).forEach(k=>delete dj[k]); Object.assign(dj,sj); r.jUpd++; } });
  });
  dst.updated=Math.max(dst.updated||0, src.updated||0);
  return r;
}

/* mode: 'merge'（既存に差分を足す）／'replace'（丸ごと置き換え） 戻り値は結果の文言 */
async function importSiteObj(o, mode){
  const existsRaw=Store.get('dl:site:'+o.site.id);
  await importPhotos(o); PIC={}; for(const k in TH) delete TH[k];
  if(!existsRaw || mode==='replace'){
    const s=o.site; s.poles=s.poles.map(migratePole); s.perf=s.perf||[]; s.elb=s.elb||[]; s.conc=s.conc||[]; s.settings=Object.assign(blankSite().settings, s.settings||{});
    if(SITE && SITE.id===s.id){ SITE=s; save(); } else { persistSite(s); if(!SITE){ SITE=s; save(); V={screen:'poles',poleId:null,tab:'ledger',filter:'all'}; } }
    return (existsRaw?'置き換えました':'新しい現場として取り込みました')+'（'+esc(s.name||'')+'　'+s.poles.length+'本）';
  }
  let target; const isCur=SITE && SITE.id===o.site.id;
  if(isCur) target=SITE; else { target=JSON.parse(existsRaw); target.poles=target.poles.map(migratePole); }
  const r=mergeSiteData(target,o.site);
  if(isCur) save(); else persistSite(target);
  const parts=[]; if(r.pAdd) parts.push('管理番号 追加'+r.pAdd); if(r.pUpd) parts.push('台帳 更新'+r.pUpd); if(r.jAdd) parts.push('作業 追加'+r.jAdd); if(r.jUpd) parts.push('作業 更新'+r.jUpd);
  return 'マージしました（'+esc(target.name||'')+'　'+(parts.length?parts.join('・'):'変更なし')+'）';
}

let syncDir=null, syncTimer=null, syncBusy=false, syncNeedAsk=false;
function syncOK(){ return !!window.showDirectoryPicker; }
function syncLog(){ try{ return JSON.parse(Store.get('dl:sync:log')||'[]'); }catch(e){ return []; } }
function syncLogAdd(t){ const L=syncLog(); L.unshift({t:Date.now(),m:t}); Store.set('dl:sync:log',JSON.stringify(L.slice(0,30))); }
async function syncSetup(){

  try{ const h=await window.showDirectoryPicker({mode:'read'}); await picPut('sync:dir',h); syncDir=h; syncNeedAsk=false; Store.set('dl:sync:name',h.name); syncStart(); syncLogAdd('受信フォルダ「'+h.name+'」の監視を開始'); $('#sheet').classList.remove('open'); render(); toast('受信フォルダ「'+h.name+'」を監視しています'); }catch(e){}

async function syncResume(){
  if(!syncOK()) return; const h=await picGet('sync:dir'); if(!h) return;
  try{ const perm=await h.queryPermission({mode:'read'}); if(perm==='granted'){ syncDir=h; syncStart(); } else syncNeedAsk=true; }catch(e){ syncNeedAsk=true; }
}
async function syncAsk(){ const h=await picGet('sync:dir'); if(!h) return; try{ if(await h.requestPermission({mode:'read'})==='granted'){ syncDir=h; syncNeedAsk=false; syncStart(); render(); toast('監視を再開しました'); } }catch(e){ toast('フォルダを開けません。設定し直してください'); } }
function syncStart(){ clearInterval(syncTimer); syncTimer=setInterval(syncPoll,5000); syncPoll(); }
async function syncStop(){ clearInterval(syncTimer); syncTimer=null; syncDir=null; syncNeedAsk=false; await picDel('sync:dir'); Store.del('dl:sync:name'); syncLogAdd('監視を停止'); $('#sheet').classList.remove('open'); render(); }
async function syncPoll(){
  if(!syncDir||syncBusy) return; syncBusy=true;
  try{
    let done={}; try{ done=JSON.parse(Store.get('dl:sync:done')||'{}'); }catch(e){}
    const found=[];
    for await (const [name,h] of syncDir.entries()){ if(h.kind!=='file'||!/\.json$/i.test(name)) continue; const f=await h.getFile(); const key=name+'|'+f.lastModified+'|'+f.size; if(done[key]) continue; found.push({name,f,key}); }
    found.sort((a,b)=>a.f.lastModified-b.f.lastModified);
    let touched=false;
    for(const x of found){
      try{ const o=JSON.parse(await x.f.text());
        if(o.format==='dl-genba'&&o.site){ const msg=await importSiteObj(o,'merge'); syncLogAdd(x.name+(o.from?'（'+o.from+'）':'')+'：'+msg); touched=true; }
        else syncLogAdd(x.name+'：現場データではないので飛ばしました');
      }catch(e){ syncLogAdd(x.name+'：取り込めませんでした（'+e.message+'）'); }
      done[x.key]=Date.now();
    }
    const keys=Object.keys(done); if(keys.length>500) keys.slice(0,keys.length-500).forEach(k=>delete done[k]);
    Store.set('dl:sync:done',JSON.stringify(done));
    if(touched){ render(); toast('受信フォルダから取り込みました'); }
  }catch(e){ if(e && (e.name==='NotAllowedError'||e.name==='NotFoundError')){ clearInterval(syncTimer); syncTimer=null; syncDir=null; syncNeedAsk=true; syncLogAdd('フォルダにアクセスできなくなりました。「監視を再開」を押してください'); render(); } }
  finally{ syncBusy=false; }
}

/* ============ 図ライブラリ（v88）：仕様書・解説・基準の図を登録し、チェックリストの図に使う ============
   登録した図に「部位」と「対象形式」を付けておくと、印刷の1枚目で台帳・現調の内容に合う図を自動で選び、変更・取替・新設した箇所を赤で表示する */
const FIG_PARTS=[['togu','灯具'],['pole','ポール'],['kiso','基礎'],['haikan','配管・配線'],['ap','自動点滅器']];
const FIG_PART_LABEL=Object.fromEntries(FIG_PARTS);
LIBS.fig={name:'図ライブラリ',desc:'器材仕様書・解説・設置基準の図（照明灯の全体図）。チェックリストの1枚目に1枚だけ使い、取替等をした部位を赤で示す',key:'dl:lib:fig'};
function figLib(){ return libGet('fig'); }
function figNorm(s){ return String(s||'').toUpperCase().replace(/\s+/g,'').replace(/-J$/,'').replace(/[（(].*$/,''); }
/* 形式に合う図を1枚選ぶ：対象形式が一致するもの優先、無ければ形式指定なしの図 */
function figPick(models){
  const lib=figLib(); if(!lib.length) return null;
  const want=(models||[]).map(figNorm).filter(Boolean);
  for(const m of want){ const hit=lib.find(f=>String(f.models||'').split(/[,、\s／/]+/).map(figNorm).filter(Boolean).some(x=>x===m||m.indexOf(x)===0||x.indexOf(m)===0)); if(hit) return hit; }
  return lib.find(f=>!String(f.models||'').trim()) || lib[0];
}
function figModelsOf(p,j){ const L=p.ledger; const N=((j&&j.survey)||{}).newpole||{}; return [L.newTogu,N.poleType,L.poleType,lv(L,'togu'),lampModelText(L)]; }
/* 印刷1枚目の図に出す部位と、その変更内容（赤で表示） */
function figPlan(p,j){
  const L=p.ledger; const S=(j&&j.survey)||{}; const N=S.newpole||{}; const EX=(S.expole||{}).kiso||{}; const E=S.elec||{}; const work=(j&&j.work)||''; const kind=(j&&j.kind)||'';
  const out=[]; const add=(part,models,label,change,note)=>out.push({part,models,label,change,note});
  const newKiso=/新設/.test(work)||(/建替/.test(work)&&N.reuse==='基礎を新設');
  const togu=lv(L,'togu')+(lampModelText(L)?'／'+lampModelText(L):'');
  if(/LED灯具取替|建替|新設/.test(work)){ add('togu',[L.newTogu,lv(L,'togu')],'灯具 '+(L.newTogu||'（形式未定）')+(lv(L,'maker')?'（'+lv(L,'maker')+'）':''),/新設/.test(work)?'新設':'取替','既設 '+togu); }
  else if(/撤去/.test(work)) add('togu',[lv(L,'togu'),lampModelText(L)],'灯具 '+togu,'撤去','');
  else add('togu',[lv(L,'togu'),lampModelText(L),L.newTogu],'灯具 '+togu,'','');
  const poleT=(/建替|新設/.test(work)&&N.poleType)?N.poleType:(L.poleType||'');
  if(/建替|新設/.test(work)) add('pole',[N.poleType,L.poleType],'ポール '+(poleT||'（型式未定）')+(lv(L,'height')?'　'+lv(L,'height'):'')+(lv(L,'armLen')?'　アーム'+lv(L,'armLen'):''),/新設/.test(work)?'新設':'建替','既設 '+(L.poleType||''));
  else if(/撤去/.test(work)) add('pole',[L.poleType],'ポール '+(L.poleType||''),'撤去','');
  else add('pole',[L.poleType],'ポール '+(L.poleType||'')+(lv(L,'height')?'　'+lv(L,'height'):''),'','');
  const kType=newKiso?(N.kisoType||''):(EX.kisoType||L.kisoType||''); const kDim=newKiso?(N.kisoType==='円筒基礎'?(N.kisoDia||'φ500')+'×'+(N.kisoDepth||'?')+'mm':(N.kisoSize||'')):(EX.kisoType==='円筒基礎'&&(EX.kisoDia||EX.kisoDepth)?(EX.kisoDia||'φ500')+'×'+(EX.kisoDepth||'?')+'mm':(EX.kisoSize||''));
  if(newKiso) add('kiso',[kType,N.kisoDia,poleT],'基礎 '+(kType||'')+(kDim?' '+kDim:'')+(N.anchorSize?'　アンカー'+N.anchorSize:''),'新設','');
  else if(/撤去/.test(work)) add('kiso',[kType],'基礎 '+(kType||''),'撤去','');
  else if(/建替/.test(work)) add('kiso',[kType],'基礎 '+(kType||'')+(kDim?' '+kDim:''),'','既設基礎を流用');
  else if(kType) add('kiso',[kType],'基礎 '+kType+(kDim?' '+kDim:''),'','');
  if(/配管配線|新設/.test(work)){ const C=S.cable; add('haikan',C?cModes(C):[],'配管・配線 '+(C?cModes(C).join('・'):''),/新設/.test(work)?'新設':'取替',C?[(C.pipes||[]).map(pipeText).join('、'),(C.cables||[]).map(cableText).join('、')].filter(Boolean).join('／'):''); }
  if(E.apSw==='有'&&E.apChange==='取替する') add('ap',[],'自動点滅器'+(E.apPos?'（'+E.apPos+'）':''),'取替','');
  if(kind==='応急点検工'){ const r=resultText(j); if(r&&r!=='その他'){ const m={'ブレーカ取替':'ap','自動点滅器取替':'ap','電源装置取替':'togu','LED灯具取替':'togu','引込線接続':'haikan'}[r]; if(m) out.forEach(x=>{ if(x.part===m&&!x.change){ x.change='取替'; x.note=r; } }); } }
  return out;
}

const FIGSRC={};
async function figPreload(poles){

/* 1枚目の図：登録図を1枚だけ使い、取替等をした部位を赤枠＋赤字で示す。図が無ければ自動作図 */
function prFigHtml(p,j){

  const log=[], ky=[], inh=[];
  (p.history||[]).forEach(x=>log.push('台帳との相違：'+x.label+' '+(x.from||'空欄')+' → '+(x.to||'空欄')+(x.src?'（'+x.src+'）':'')));
  if(p.memo) log.push('台帳メモ：'+p.memo);
  jobs.forEach(j=>{ const n=prNotes(j,p); n.log.forEach(x=>log.push(tag(j)+x)); n.ky.forEach(x=>ky.push(tag(j)+x)); n.inh.forEach(x=>inh.push(tag(j)+x)); });
  const un=jobs.reduce((a,j)=>a+unkCount(j),0)+unkCount(p); if(un) inh.push('「ー」（後で確認）が '+un+' 件あります');
  if(log.length){ L.push('【ログ】'); log.forEach(x=>L.push('・'+x)); }
  if(ky.length){ L.push('【協議】'); ky.forEach(x=>L.push('・'+x)); }
  if(inh.length){ L.push('【引き継ぎ】'); inh.forEach(x=>L.push('・'+x)); }
  return L;
}

/* ---- 照明の図（台帳・現調から自動作図） ---- */
function prPoleSvg(p,j){
  const L=p.ledger; const S=(j&&j.survey)||{}; const N=S.newpole||{}; const EX=(S.expole||{}).kiso||{}; const work=(j&&j.work)||''; const kind=(j&&j.kind)||'';
  const hm=parseFloat(String(lv(L,'height')).replace(/[^\d.]/g,''))||10; const armLen=parseFloat(String(lv(L,'armLen')).replace(/[^\d.]/g,''))||1.8;
  const arm=L.arm||'片側'; const both=arm==='両側', straight=arm==='ストレート';
  const W=300,H=470; const gy=360; const px=both||straight?150:120; const scale=Math.min(26,260/hm); const top=gy-hm*scale; const ax=Math.max(40,Math.min(110,armLen*40));
  const hot='#D0021B', ink='#0F2438', grey='#6E7C87';
  const hiLamp=/LED灯具取替|建替|新設|撤去/.test(work); const hiPole=/建替|新設|撤去/.test(work); const newKiso=/新設/.test(work)||(/建替/.test(work)&&N.reuse==='基礎を新設'); const hiKiso=newKiso||/撤去/.test(work); const hiCable=/配管配線|新設/.test(work);
  const kisoType=N.kisoType||EX.kisoType||L.kisoType||''; const kisoDim = (newKiso&&N.kisoType==='円筒基礎')?(N.kisoDia||'φ500')+'×'+(N.kisoDepth||'?')+'mm' : (newKiso&&N.kisoSize)?N.kisoSize : (EX.kisoType==='円筒基礎'&&(EX.kisoDia||EX.kisoDepth))?(EX.kisoDia||'φ500')+'×'+(EX.kisoDepth||'?')+'mm' : (EX.kisoSize||'');
  const kh=Math.max(40,Math.min(70,(parseFloat(String(kisoDim).match(/×(\d+)/)?String(kisoDim).match(/×(\d+)/)[1]:'1500')||1500)/30)); const kw=kisoType==='直接埋込'?14:kisoType==='橋梁基礎'?70:44;
  const poleType=(newKiso||/新設|建替/.test(work))&&N.poleType?N.poleType+'（新設）':(L.poleType||'');
  const toguOld=lv(L,'togu')+(lampModelText(L)?'／'+lampModelText(L):'')+(L.lamp?'（'+L.lamp+'）':''); const toguNew=L.newTogu?L.newTogu+(lv(L,'maker')?'（'+lv(L,'maker')+'）':''):'';
  const E=S.elec||{}; const hikikomi=lv(L,'hikikomi');
  let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Hiragino Sans,Yu Gothic,sans-serif" font-size="10" fill="'+ink+'">';
  // 地面・基礎
  s+='<line x1="10" y1="'+gy+'" x2="'+(W-10)+'" y2="'+gy+'" stroke="'+ink+'" stroke-width="1.5"/>';
  for(let x=14;x<W-10;x+=12) s+='<line x1="'+x+'" y1="'+gy+'" x2="'+(x-6)+'" y2="'+(gy+6)+'" stroke="'+grey+'" stroke-width="0.7"/>';
  s+='<rect x="'+(px-kw/2)+'" y="'+gy+'" width="'+kw+'" height="'+kh+'" fill="'+(hiKiso?'#FDE3E5':'#fff')+'" stroke="'+(hiKiso?hot:ink)+'" stroke-width="'+(hiKiso?2:1)+'"'+(kisoType==='橋梁基礎'?' stroke-dasharray="4 2"':'')+'/>';
  if(kisoType&&kisoType!=='直接埋込') s+='<text x="'+(px+kw/2+6)+'" y="'+(gy+kh-4)+'" font-size="9" fill="'+grey+'">'+esc(kisoType)+'</text>';
  // 配管（地中引込・配管配線）
  if(/連接|地中/.test(hikikomi)||hiCable){ s+='<line x1="'+(px+kw/2)+'" y1="'+(gy+22)+'" x2="'+(W-14)+'" y2="'+(gy+22)+'" stroke="'+(hiCable?hot:grey)+'" stroke-width="'+(hiCable?2.5:1.2)+'" stroke-dasharray="6 3"/><text x="'+(W-14)+'" y="'+(gy+34)+'" text-anchor="end" font-size="8.5" fill="'+(hiCable?hot:grey)+'">'+(hiCable?'配管・配線（取替／新設）':'地中引込')+'</text>'; }
  if(/単独|架空/.test(hikikomi)){ const ay=top+40; s+='<path d="M '+(px+6)+' '+ay+' Q '+(px+70)+' '+(ay+30)+' '+(W-16)+' '+(ay+10)+'" fill="none" stroke="'+grey+'" stroke-width="1.2"/><text x="'+(W-16)+'" y="'+(ay+24)+'" text-anchor="end" font-size="8.5" fill="'+grey+'">架空引込</text>'; }
  // ポール（テーパー）
  s+='<polygon points="'+(px-6)+','+gy+' '+(px+6)+','+gy+' '+(px+3)+','+top+' '+(px-3)+','+top+'" fill="'+(hiPole?'#FDE3E5':'#fff')+'" stroke="'+(hiPole?hot:ink)+'" stroke-width="'+(hiPole?2:1.3)+'"/>';
  s+='<rect x="'+(px-10)+'" y="'+(gy-4)+'" width="20" height="4" fill="#fff" stroke="'+ink+'" stroke-width="1"/>'; // ベースプレート
  s+='<rect x="'+(px-3.5)+'" y="'+(gy-60)+'" width="7" height="18" fill="#fff" stroke="'+grey+'" stroke-width="0.8"/>'; // 開口部
  // アーム・灯具
  const lamp=(x,dir)=>{ const lx=dir>0?x:x-30; s+='<path d="M '+px+' '+(top+6)+' Q '+(px+dir*ax*0.5)+' '+(top-10)+' '+(px+dir*ax)+' '+(top-8)+'" fill="none" stroke="'+(hiPole?hot:ink)+'" stroke-width="'+(hiPole?2:1.3)+'"/>'; s+='<rect x="'+(dir>0?px+ax-4:px-ax-26)+'" y="'+(top-14)+'" width="30" height="9" rx="2" fill="'+(hiLamp?'#FDE3E5':'#fff')+'" stroke="'+(hiLamp?hot:ink)+'" stroke-width="'+(hiLamp?2:1.3)+'"/>'; };
  if(straight){ s+='<rect x="'+(px-16)+'" y="'+(top-12)+'" width="32" height="10" rx="2" fill="'+(hiLamp?'#FDE3E5':'#fff')+'" stroke="'+(hiLamp?hot:ink)+'" stroke-width="'+(hiLamp?2:1.3)+'"/>'; }
  else { lamp(px,1); if(both) lamp(px,-1); }
  // 自動点滅器
  if(E.apSw==='有'){ const apy=top+24; s+='<circle cx="'+(px+9)+'" cy="'+apy+'" r="4" fill="#fff" stroke="'+ink+'"/><text x="'+(px+16)+'" y="'+(apy+3)+'" font-size="8.5" fill="'+grey+'">自動点滅器'+(E.apPos?'（'+esc(E.apPos)+'）':'')+(E.apChange==='取替する'?' 取替':'')+'</text>'; }
  // 注記
  const note=(x,y,lines,color)=>{ lines.forEach((t,i)=>{ if(!t) return; s+='<text x="'+x+'" y="'+(y+i*12)+'" font-size="'+(i===0?9.5:8.5)+'" font-weight="'+(i===0?'700':'400')+'" fill="'+(color||ink)+'">'+esc(t)+'</text>'; }); };
  note(12,16,['灯具：'+(toguOld||'　'), toguNew?'→ 新設 '+toguNew:'', hiLamp?'【取替箇所】':''], hiLamp?hot:ink);
  note(12,top+60,['ポール：'+(poleType||'　'), (lv(L,'height')?'高さ '+lv(L,'height'):'')+(lv(L,'armLen')?'　アーム '+lv(L,'armLen'):'')+(L.arm?'（'+L.arm+'）':''), hiPole?'【'+(/撤去/.test(work)?'撤去':/新設/.test(work)?'新設':'建替')+'】':''], hiPole?hot:ink);
  note(12,gy+kh+16,['基礎：'+(kisoType||'　')+(kisoDim?' '+kisoDim:''), newKiso?'【基礎を新設】':(/建替/.test(work)&&N.reuse==='既設基礎を流用'?'既設基礎を流用':''), (N.anchorSize&&newKiso?'アンカー '+N.anchorSize:'')], hiKiso?hot:ink);
  if(kind==='応急点検工') note(12,H-12,['応急点検：'+(causeText(j)||'点検中')+(resultText(j)?' → '+resultText(j):'')],hot);
  s+='</svg>';
  return s;
}

/* ---- ページ組み立て（1管理番号＝1組：その番号の全作業をまとめる） ---- */
function prJobStatus(j){ return stInfo(status(j)).t; }
function prJobSummary(j,p){
  if(j.kind==='応急点検工'){ const ip=inspProgress(j); const d=j.insp.start?fmtDT(j.insp.start).replace(/ .*$/,''):j.date; return prH4('① 点検',d,ip.done,ip.total)+prInspSummary(j,p)+prH4('② 復旧方法・報告',j.insp.reportWhen,0,0,j.insp.reportDone==='有'?'報告完了':'')+prInspResultSummary(j,p)+prH4('③ 記録','',0,0)+prInspRecordSummary(j); }
  const sp=surveyProgress(j), kp=sekoProgress(j); let lastSeko=0; Object.values(j.seko||{}).forEach(c=>{ if(c&&c.at) lastSeko=Math.max(lastSeko,c.at); if(c&&c.sub) Object.values(c.sub).forEach(x=>{ if(x&&x.at) lastSeko=Math.max(lastSeko,x.at); }); });
  const sd=j.date, kd=(j.seko['pre.plan']||{}).date||(lastSeko?fmtDT(lastSeko).replace(/ .*$/,''):''); const M=j.meas||{}; const mn=['ins','earth','volt','amp','torque','plumb'].filter(k=>M[k]!=null&&M[k]!=='').length;
  return prH4('① '+survName(j,true),sd,sp.done,sp.total,sp.warn?'要協議'+sp.warn:'')+prSurveySummary(j,p)+prH4('② 施工',kd,kp.done,kp.total,j.closed?'完了':'')+prSekoSummary(j,p)+prH4('③ 品質管理',lastSeko?fmtDT(lastSeko).replace(/ .*$/,''):'',mn,6)+prQcSummary(j);
}
function prJobDetail(j,p){
  let d='';
  if(j.kind==='応急点検工'){ d+=prSec('応急点検',prInspRows(j,p)); }
  else {
    prSurveySections(j,p).forEach(sec=>{ d+=prSec(survName(j,true)+'：'+sec.name,sec.html); });
    d+=prSec('協議（設計との差異）',prKyogiRows(j));
    prSekoSections(j,p).forEach(sec=>{ d+=prSec('施工：'+sec.name,sec.html); });
    d+=prSec('測定・試験（品質管理）',prMeasRows(j));
  }
  const pics=j.pics||[]; if(pics.length){ const byTag={}; pics.forEach(x=>{ byTag[x.tag]=(byTag[x.tag]||0)+1; }); d+=prSec('写真',Object.entries(byTag).map(([t,n])=>prRow(t,n+'枚')).join('')); }
  if(j.closed) d+=prSec('工種の完了',prRow('完了',fmtDT(j.closed),null,null,'これ以上の施工は派生しない'));
  return d||'<div class="nd" style="margin:1mm 2mm">記録なし</div>';
}
function prPolePages(p){
  const jobs=p.jobs.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  // 1枚目の要点に使う「主となる作業」：最新の補修・修繕、無ければ最新の応急点検
  const main = jobs.slice().reverse().find(j=>j.kind!=='応急点検工') || jobs[jobs.length-1] || null;
  const dates=jobs.map(j=>j.date).filter(Boolean); const dateTxt=dates.length? (dates.length===1?dates[0]:dates[0]+' 〜 '+dates[dates.length-1]) : '';
  const head='<table class="hd"><tr><th>現場名</th><td colspan="3">'+esc(SITE.name||'')+(SITE.place?'　'+esc(SITE.place):'')+'</td><th>受注者</th><td>'+esc(PRINT_COMPANY)+'</td></tr>'
    + '<tr><th>管理番号</th><td class="big">'+esc(p.no||'')+'</td><th>路線</th><td>'+esc(staText(p))+(p.addr?'<br><small>'+esc(p.addr)+'</small>':'')+'</td><th>作業日</th><td>'+esc(dateTxt)+'</td></tr>'
    + '<tr><th>工種／作業内容</th><td colspan="3">'+(jobs.length? jobs.map(j=>esc((j.date||'')+' '+jobLabel(j))+'<small>（'+esc(prJobStatus(j))+'）</small>').join('　／　') : '（作業なし：台帳のみ）')+'</td><th>作成者</th><td>'+esc(SITE.by||'')+'<small class="r">出力 '+prDate()+'</small></td></tr></table>';
  let right='';
  if(!main) right='<div class="nd">作業が登録されていません。台帳の内容は次ページ</div>';
  else { right+=prJobSummary(main,p); }
  const notes=prPoleNotes(p,jobs);
  const strip = main ? (function(){ const st=stInfo(status(main)); if(main.kind==='応急点検工'){ const ip=inspProgress(main); return '<div class="strip"><span class="badge st">'+esc(st.t)+'</span><span>点検 '+ip.done+'／'+ip.total+'</span><span>結果：'+esc(causeText(main)||'—')+'</span><span>復旧：'+esc(resultText(main)||'—')+'</span></div>'; } const sp=surveyProgress(main), kp=sekoProgress(main); return '<div class="strip"><span class="badge st">'+esc(st.t)+'</span><span>'+esc(survName(main))+' '+sp.done+'／'+sp.total+(sp.warn?' <b class="rd">要協議'+sp.warn+'</b>':'')+'</span><span>施工 '+kp.done+'／'+kp.total+'</span>'+(kyogiOpen(main)?'<span class="rd">協議 未決</span>':'')+(main.closed?'<span class="okc">工種完了 '+esc(fmtDT(main.closed).replace(/ .*$/,''))+'</span>':'')+'</div>'; })() : '';
  let out='<div class="pp p1">'+head+strip
    + '<div class="mid"><div class="fig"><div class="cap">照明の図'+(main?'　<small>'+esc(jobLabel(main))+'</small>':'')+'</div>'+prFigHtml(p,main)+'</div><div class="sumr"><div class="cap">チェックリスト'+(main?'<small>　'+esc((main.date||'')+' '+jobLabel(main))+(jobs.length>1?'　※他の作業は次ページ以降':'')+'</small>':'')+'</div>'+right+'</div></div>'
    + '<div class="notes"><div class="cap">備考・協議事項・引き継ぎ（現調→施工）</div><div class="nb">'+notes.map(x=>/^【/.test(x)?'<b>'+esc(x)+'</b>':esc(x)).join('<br>')+'</div></div>'
    + '<div class="ft">'+esc(p.no||'')+'　1枚目（要点）　次ページ以降：台帳・各作業の全項目一覧</div></div>';
  // 2枚目以降
  let d='<div class="pp p2"><div class="ph">'+esc(p.no||'')+'　'+esc(staText(p))+'<span class="r">'+esc(SITE.name||'')+'</span></div>';
  d+=prHead('台帳','変更履歴・添付を含む')+prTbl(prLedgerRows(p),'',true);
  jobs.forEach(j=>{
    d+='<div class="jh">'+esc((j.date||'')+'　'+jobLabel(j))+'<span class="r">'+esc(prJobStatus(j))+'</span></div>';
    if(j!==main) d+='<div class="sumr inl">'+prJobSummary(j,p)+'</div>';
    d+=prJobDetail(j,p);
  });
  d+='<div class="ft">未入力は空欄、現地で確認できなかった項目は「ー」。判定は現場情報の規定値による</div></div>';
  return out+d;
}
function prBuild(scope){
  let ps=[];
  if(scope==='pole'){ const p=pole(); if(p) ps=[p]; }
  else ps=sortedPoles();
  return ps.map(prPolePages).join('');
}
function openPrint(){
  const inPole=(V.screen==='job'||V.screen==='pole')&&pole();
  let h='<h2>印刷・PDF</h2><div class="note" style="padding:0 0 8px">1管理番号ごとに1組（その番号の全作業をまとめて）：1枚目＝図と要点、2枚目以降＝台帳・各作業の全項目のチェックリストを出します。プレビューのあと「印刷」を押してください（iPad：共有 → プリント → プレビューをピンチで開くとPDFとして保存できます）</div><div class="menu">';
  if(inPole) h+='<button data-print="pole">この管理番号<small>'+esc(pole().no||'管理番号未設定')+'　作業 '+pole().jobs.length+'件</small></button>';
  h+='<button data-print="site">現場全体<small>全管理番号（'+SITE.poles.length+'本）。作業がない管理番号は台帳のみ</small></button>';
  h+='<button data-print="screen">いま開いている画面をそのまま印刷</button></div>';
  openSheet(h);
}
async function showPrint(scope){
  $('#sheet').classList.remove('open');
  if(scope==='screen'){ document.querySelectorAll('.sec').forEach(s=>s.classList.add('open')); setTimeout(()=>window.print(),100); return; }
  const ps=scope==='pole'?(pole()?[pole()]:[]):sortedPoles();
  try{ await figPreload(ps); }catch(e){}
  const html=prBuild(scope); if(!html){ toast('印刷する内容がありません'); return; }
  const pv=$('#printView'); $('#printPages').innerHTML=html; pv.classList.add('show'); document.body.classList.add('printing'); window.scrollTo(0,0);
  $('#printPages').scrollTop=0;
}
function closePrint(){ $('#printView').classList.remove('show'); document.body.classList.remove('printing'); $('#printPages').innerHTML=''; }
document.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.print){ showPrint(b.dataset.print); return; }
  if(b.id==='prDo'){ window.print(); return; }
  if(b.id==='prClose'){ closePrint(); return; }
});

</script>
